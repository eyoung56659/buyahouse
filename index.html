<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HOUSE FILE — GAME 1 + CASE REVIEW v10.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap');

:root{
  --cream:#fff6e8;--paper:#fff;--ink:#241f2b;--soft:#6b6474;--line:#eadfce;
  --purple:#6d5ce8;--purple2:#4939bd;--purplebg:#f2efff;
  --green:#17995a;--greenbg:#ebfaf2;
  --red:#ef4852;--redbg:#fff0f1;
  --amber:#ffb21a;--amberbg:#fff6d9;
  --blue:#2d78c9;--bluebg:#eef6ff;
  --shadow:0 7px 0 rgba(36,31,43,.09)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 10% 0,#fff1d8,transparent 35%),
    radial-gradient(circle at 100% 90%,#eee9ff,transparent 35%),
    var(--cream);
  color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;min-height:100vh
}
button{font:inherit;color:inherit}
#app{width:100%;max-width:560px;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(36,31,43,.1);overflow:hidden;position:relative}
#hud{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;border-bottom:4px solid var(--amber);padding:9px 12px}
.hud1,.hud2{display:flex;align-items:center;gap:7px}.hud2{margin-top:6px;flex-wrap:wrap}
.stage{font:700 11px 'IBM Plex Mono';color:#ffe7aa;flex:1}.cash{font:700 18px 'IBM Plex Mono';color:#83f7b3}
.pill{font-size:10.5px;background:rgba(255,255,255,.1);padding:3px 7px;border-radius:999px}
.hbtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:5px 7px;font-size:10.5px;cursor:pointer}
.hbtn:disabled{opacity:.3}
#stage{padding:22px 18px 48px;min-height:calc(100vh - 78px);animation:sceneIn .28s ease}
.brand{font-family:'Gaegu',cursive}.eyebrow{font:700 11px 'IBM Plex Mono';color:var(--purple)}
h1{font:700 30px 'Gaegu';margin:4px 0 6px;line-height:1.15}
h2{font:700 24px 'Gaegu';margin:5px 0}
h3{font:700 18px 'Gaegu';margin:4px 0 7px}
.sub{font-size:13.5px;color:var(--soft);line-height:1.55;margin:0 0 16px}.body{font-size:15px;line-height:1.72}
.tiny{font-size:11.5px;color:var(--soft);line-height:1.55}
.hero{text-align:center;padding:18px 0}.hero .emoji{font-size:56px}
.panel{border:2px solid var(--line);border-radius:15px;padding:13px;margin:12px 0;background:#fff}
.panel.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.panel.warn{background:var(--amberbg);border-color:#efd387}
.panel.bad{background:var(--redbg);border-color:#f2b8bd}.panel.good{background:var(--greenbg);border-color:#bce7cd}
.panel.blue{background:var(--bluebg);border-color:#bad5f1}.panel.purple{background:var(--purplebg);border-color:#cbc1ff}
.narrator{border-left:4px solid var(--purple);background:var(--purplebg);border-radius:10px;padding:11px 13px;margin:13px 0;font-size:14px;line-height:1.62}
.narrator.bad{border-color:var(--red);background:var(--redbg)}.narrator.good{border-color:var(--green);background:var(--greenbg)}
.npc{display:flex;gap:9px;margin:13px 0}.avatar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#ffe2a6;border-radius:12px;flex:none;font-size:20px}
.bubble{border:2px solid var(--line);background:#fffaf0;border-radius:14px 14px 14px 3px;padding:10px 12px;font-size:14px;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:13px 14px;text-align:left;box-shadow:var(--shadow);cursor:pointer;font-size:14px;line-height:1.52}
.choice:active,.primary:active{transform:translateY(3px);box-shadow:none}.choice small{display:block;color:var(--soft);font-size:11.5px;margin-top:4px;line-height:1.45}
.primary{width:100%;border:none;border-radius:14px;background:var(--purple);color:white;font-weight:700;padding:14px;margin-top:15px;box-shadow:0 6px 0 var(--purple2);cursor:pointer}
.primary:disabled{background:#cfc9db;box-shadow:0 6px 0 #b5aec2}
.ghost{width:100%;border:2px dashed var(--purple);background:#fff;color:var(--purple);font-weight:700;border-radius:13px;padding:10px;margin-top:9px;cursor:pointer}
.moneycard{background:var(--ink);color:#fff;border-radius:16px;padding:15px 17px;margin:13px 0}
.moneycard .label{font-size:11px;opacity:.7}.moneycard .amt{font:700 25px 'IBM Plex Mono';margin-top:3px}.moneycard.loss .amt{color:#ff858d}.moneycard.gain .amt{color:#86f4b3}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 1px;border-bottom:1px dashed var(--line);font-size:13px}.stat:last-child{border-bottom:none}.stat b{font-family:'IBM Plex Mono';text-align:right}
.tabs{display:flex;gap:6px;margin:12px 0}.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}.tab.done:after{content:' ✓';color:#7dffae}
.checkitem{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}.checkitem:last-child{border-bottom:none}
.box{width:20px;height:20px;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.checkitem.done .box,.audit.done .box{background:var(--green);border-color:var(--green);color:#fff}
.checkitem b{display:block;font-size:13px}.checkitem span{font-size:11.5px;color:var(--soft)}
.parallel{background:#17132c;color:#fff;border-radius:18px;padding:20px;margin:12px 0}.parallel h2{font-family:'Gaegu';font-size:24px;color:#c6bbff;margin:4px 0}.parallel p{font-size:13px;line-height:1.7;color:#e4def1}
.badend{background:#1b1117;color:#fff;margin:-22px -18px -48px;padding:38px 22px;min-height:calc(100vh - 74px);text-align:center}
.badend .skull{font-size:56px}.badend h1{color:#ff6972}.badend p{text-align:left;font-size:13px;line-height:1.7}
.retry{width:100%;border:none;border-radius:14px;background:#ff6972;color:#24131a;font-weight:700;padding:14px;margin-top:16px;cursor:pointer}
.concept{border:2px solid var(--amber);background:#fff8df;border-radius:14px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.65}
.audit{display:flex;gap:9px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:10px 0;cursor:pointer}.audit:last-child{border-bottom:none}
.clear{text-align:center}.cup{font-size:56px}.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;font:700 10px 'IBM Plex Mono';margin-right:7px}
.phasebar{height:7px;background:#eee6d8;border-radius:999px;overflow:hidden;flex-basis:100%;margin-top:2px}.phasebar>div{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .3s}
.processStep{border:2px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;display:flex;gap:9px;align-items:center}.processStep.done{border-color:var(--green);background:var(--greenbg)}
.processStep .num{width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px 'IBM Plex Mono';flex:none}
.ownerFlip{font:700 24px 'IBM Plex Mono';padding:16px;text-align:center;border:2px solid var(--line);border-radius:15px;background:#fff}.ownerFlip .old{text-decoration:line-through;color:var(--soft)}.ownerFlip .new{color:var(--green);font-size:30px}
.scanline{font:700 11px 'IBM Plex Mono';color:var(--purple);letter-spacing:.08em}.scanpulse{animation:scanPulse .75s ease infinite alternate}
.eventBreak{min-height:62vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 4px;position:relative}
.eventBreak:before{content:'';position:absolute;inset:-22px -18px -48px;z-index:-1;background:radial-gradient(circle at center,#fff 0,#fff 40%,#f5f0e8 100%)}
.eventBreak.danger:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#ffe6e8 100%)}.eventBreak.good:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#e7f8ee 100%)}
.eventBreak.notice:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#eeeaff 100%)}
.eventTime{display:inline-block;align-self:center;font:700 11px 'IBM Plex Mono';background:#f4efe6;border:1px solid var(--line);border-radius:999px;padding:7px 11px;margin-bottom:17px;color:var(--soft)}
.eventIcon{font-size:58px}.eventLabel{font:700 11px 'IBM Plex Mono';letter-spacing:.1em;color:var(--red);margin-top:11px}.eventBreak.good .eventLabel{color:var(--green)}.eventBreak.notice .eventLabel{color:var(--purple)}
.eventTitle{font:700 35px 'Gaegu';line-height:1.08;margin:6px 0 10px}.eventAlert{border:2px solid var(--red);background:#fff;border-radius:15px;padding:11px 13px;margin:10px 0;text-align:left;box-shadow:var(--shadow)}
.eventBreak.good .eventAlert{border-color:var(--green)}.eventAlert .source{font:700 10px 'IBM Plex Mono';color:var(--soft);margin-bottom:4px}
.eventMsg{background:#fff;border:2px solid var(--line);border-radius:15px;padding:12px 13px;font-size:13.5px;line-height:1.65}.eventQ{font:700 20px 'Gaegu';margin:14px 3px 0;line-height:1.35}
.bossbar{height:11px;background:#eee6d8;border-radius:999px;overflow:hidden;margin:11px 0}.bossbar>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));transition:width .35s}
.lifeSavings{border:3px solid var(--red);background:var(--redbg);border-radius:16px;padding:14px;margin:13px 0;text-align:center;box-shadow:0 7px 0 rgba(239,72,82,.09)}
.lifeSavings .years{font:700 11px 'IBM Plex Mono';color:var(--red)}.lifeSavings .big{font:700 28px 'IBM Plex Mono';color:var(--ink);margin:4px 0}
.listing{border:2px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.listing.selected{border-color:var(--purple);background:var(--purplebg)}
.reviewTop{border:3px solid var(--purple);background:linear-gradient(135deg,#f2efff,#fff);border-radius:18px;padding:14px;margin:12px 0}
.reviewNo{font:700 11px 'IBM Plex Mono';color:var(--purple)}.reviewTitle{font:700 27px 'Gaegu';margin:3px 0}
.reviewScene{border:2px solid var(--line);background:#fffaf0;border-radius:14px;padding:11px 12px;margin:10px 0}.reviewScene b{display:block;margin-bottom:4px}
.reviewTeach{border:2px solid #b7d3f1;background:var(--bluebg);border-radius:14px;padding:12px;margin:10px 0}.reviewTeach h3{color:var(--blue)}
.reviewRemember{border:2px solid #e6c567;background:var(--amberbg);border-radius:14px;padding:10px 12px;font-weight:700;margin:10px 0}
.reviewQuiz{border:2px solid #bce7cd;background:var(--greenbg);border-radius:14px;padding:12px;margin:10px 0}.reviewQuiz .q{font:700 19px 'Gaegu';color:var(--green)}
.feedback{min-height:22px;font-size:12px;font-weight:700;margin-top:8px}.ok{color:var(--green)}.no{color:var(--red)}
.sheetCue{border:2px dashed var(--purple);background:#faf8ff;border-radius:12px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.6}
.sheetCue b{color:var(--purple)}
.timeline{display:flex;flex-direction:column;gap:7px;margin:10px 0}.timeline .step{display:flex;gap:9px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:9px;background:#fff}
.timeline .n{width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 10px 'IBM Plex Mono';flex:none}
.recordgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.record{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}.record b{display:block;font-size:12.5px}.record span{font-size:11px;color:var(--soft)}
.reviewNav{display:flex;gap:7px;margin-top:12px}.reviewNav button{flex:1}
.finalQ{border:2px solid var(--line);border-radius:13px;padding:11px;margin:9px 0}.finalQ b{display:block;margin-bottom:7px}
.orderpool,.orderbuilt{display:flex;flex-direction:column;gap:8px}.orderitem{border:2px solid var(--ink);border-radius:12px;padding:10px;background:#fff;cursor:pointer;font-size:13px}.orderbuilt .orderitem{border-color:var(--purple);background:var(--purplebg)}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:200}
.flashRed{animation:redFlash .55s ease}.flashGreen{animation:greenFlash .55s ease}.screenShake{animation:shake .38s ease}.screenZoom{animation:zoomHit .55s ease}
.popup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.75);width:min(88vw,430px);background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;z-index:230;box-shadow:0 18px 0 rgba(36,31,43,.18);animation:popupIn .28s cubic-bezier(.18,.8,.32,1.3) forwards}
.popup h2{font:700 26px 'Gaegu';margin:0 0 6px}.popup .icon{font-size:42px;text-align:center}.popup button{width:100%;margin-top:12px;border:none;border-radius:12px;padding:12px;background:var(--purple);color:white;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(20,16,28,.55);z-index:220}
.moneyFloat{position:fixed;z-index:240;font:700 30px 'IBM Plex Mono';color:#ff5964;text-shadow:0 2px 0 #fff;animation:moneyFly 1.1s ease forwards;pointer-events:none}
.confettiPiece{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:260;animation:fall 1.8s linear forwards}
@keyframes sceneIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes zoomHit{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes redFlash{0%{box-shadow:inset 0 0 0 0 rgba(255,60,70,0)}30%{box-shadow:inset 0 0 0 999px rgba(255,60,70,.16)}100%{box-shadow:inset 0 0 0 0 rgba(255,60,70,0)}}
@keyframes greenFlash{0%{box-shadow:inset 0 0 0 0 rgba(40,200,100,0)}30%{box-shadow:inset 0 0 0 999px rgba(40,200,100,.13)}100%{box-shadow:inset 0 0 0 0 rgba(40,200,100,0)}}
@keyframes popupIn{to{transform:translate(-50%,-50%) scale(1)}}@keyframes moneyFly{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(.95)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes scanPulse{from{opacity:.35}to{opacity:1}}
.choice:focus-visible,.primary:focus-visible,.ghost:focus-visible,.tab:focus-visible,.hbtn:focus-visible,.orderitem:focus-visible{outline:4px solid #111;outline-offset:2px}
@media(max-width:460px){#stage{padding-left:14px;padding-right:14px}.badend{margin-left:-14px;margin-right:-14px}h1{font-size:27px}.recordgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><header id="hud"></header><main id="stage"></main></div>
<div id="fxLayer"></div>

<script>
'use strict';

const SCHEMA_VERSION=10;
const STORE='HOUSE_FILE_GAME1_V10_REVIEW';
const HIST='HOUSE_FILE_GAME1_V10_REVIEW_H';

const C={
  startCash:320000000, price:300000000, deposit:30000000, mid:120000000, balance:150000000,
  address:'서울시 해솔구 독립로 17 / 101동 703호 / 전용 59㎡',
  wrongAddress:'서울시 해솔구 독립로 17 / 101동 307호 / 전용 49㎡',
  owner:'김민수', proxy:'박현우',
  mortgageBank:'A은행', mortgageMax:220000000, mortgageActualDebt:180000000,
  newMortgageBank:'B저축은행', newMortgageMax:120000000
};

const LISTINGS={
 A:{name:'A · 역세권 구축',detail:'역 5분 · 25년차 · 12층 남향 · 2년 전 내부수리 · 주차 혼잡'},
 B:{name:'B · 균형형',detail:'역 8분 · 15년차 · 8층 남동향 · 관리상태 양호 · 주차 무난'},
 C:{name:'C · 신축급 급매',detail:'역 12분 · 8년차 · 3층 · 내부 신축급 · 상권은 조금 멂'}
};

const BAD={
 BE00:{title:'등기부도 안 보고 돈부터 보냈습니다',loss:30000000,checkpoint:'parallelFirst',
  story:'소유자와 권리관계를 확인하기도 전에 계약금 성격의 돈을 먼저 보냈습니다. 이 게임의 실패세계에서는 반환을 둘러싼 분쟁이 생겼습니다.'},
 BE01:{title:'주소 한 칸을 놓쳤습니다',loss:20000000,checkpoint:'contractDraft',
  story:'계약서에는 101동 307호가 적혀 있었지만 실제로 본 집은 101동 703호였습니다. 목적물을 바로잡지 않은 채 계약해 분쟁이 발생했습니다.'},
 BE02:{title:'형이라고 다 대리인은 아니었습니다',loss:25000000,checkpoint:'partyBoss',
  story:'등기부상 소유자는 김민수인데 계약하러 나온 박현우의 대리권을 확인하지 않았습니다. 가족이라는 설명만 믿고 계약금을 지급한 실패세계입니다.'},
 BE03:{title:'을구를 봤지만 그냥 지나쳤습니다',loss:270000000,checkpoint:'mortgagePlan',
  story:'선순위 근저당권을 확인하고도 처리 조건 없이 거래를 진행했습니다. 이 게임의 실패세계에서는 담보권 문제로 큰 손실이 발생합니다.'},
 BE04:{title:'잔금 버튼부터 눌렀습니다',loss:170000000,checkpoint:'balanceApproach',
  story:'중도금 지급 뒤 새 근저당권이 설정됐지만 잔금 직전 최신 등기부를 확인하지 않은 채 송금을 진행한 실패세계입니다.'},
 BE05:{title:'돈은 냈는데 집은 남의 것',loss:260000000,checkpoint:'registerChoice',
  story:'잔금까지 지급하고도 소유권이전등기를 미루는 사이 제3자가 먼저 등기를 마친 실패세계입니다.'}
};

const DEF={
 schemaVersion:SCHEMA_VERSION,mode:'game',scene:'title',checkpoint:'title',cash:C.startCash,selectedListing:null,
 badEnds:[],lossLedger:{},reincarnations:0,activeBad:null,
 paid:{deposit:false,mid:false,balance:false},
 regTab:'title',regTicks:{},authority:false,actualDebtChecked:false,plan:false,
 contractFixed:false,newMortgageFound:false,
 balanceLocks:{registry:false,mortgage:false,transfer:false,delivery:false},
 clearanceStep:0,registerStep:0,registered:false,auditScanning:null,
 audit:{title:false,owner:false,mortgage:false},
 reviewEntry:'game',reviewIndex:0,reviewDone:{},reviewAnswers:{},reviewAttempts:{},finalAttempts:{},reviewOrder:[]
};

let S=load(),H=loadH();

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
 try{
   const raw=localStorage.getItem(STORE);
   if(!raw)return clone(DEF);
   const data=JSON.parse(raw);
   if(data.schemaVersion!==SCHEMA_VERSION){
     localStorage.removeItem(STORE);localStorage.removeItem(HIST);
     return clone(DEF);
   }
   return Object.assign(clone(DEF),data);
 }catch(e){return clone(DEF)}
}
function loadH(){try{return JSON.parse(localStorage.getItem(HIST)||'[]')}catch(e){return[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(S));localStorage.setItem(HIST,JSON.stringify(H))}
function money(n){return '₩'+Math.round(n||0).toLocaleString('ko-KR')}
function snap(){H.push(clone(S));if(H.length>40)H.shift()}
function go(id,mut=null,opt={}){if(!opt.skip)snap();if(mut)mut();S.scene=id;save();render();window.scrollTo(0,0)}
function back(){if(!H.length)return;S=H.pop();save();render();window.scrollTo(0,0)}
function setCP(x){S.checkpoint=x;save()}
function reset(){if(confirm('GAME 1과 CASE REVIEW 진행 상황을 모두 초기화할까요?')){localStorage.removeItem(STORE);localStorage.removeItem(HIST);S=clone(DEF);H=[];render()}}
function recordBad(code){if(!S.badEnds.includes(code)){S.badEnds.push(code);S.lossLedger[code]=BAD[code].loss}}
function bad(code){recordBad(code);S.activeBad=code;S.checkpoint=BAD[code].checkpoint;save();fx('bad');setTimeout(()=>go('badend',null,{skip:true}),180)}
function reincarnate(){S.reincarnations++;S.scene=S.checkpoint;S.activeBad=null;H=[];save();render();window.scrollTo(0,0)}
function fx(type){const a=document.querySelector('#app');a.classList.remove('screenShake','screenZoom','flashRed','flashGreen');void a.offsetWidth;if(type==='bad')a.classList.add('screenShake','flashRed');if(type==='good')a.classList.add('screenZoom','flashGreen')}
function moneyFx(n){const d=document.createElement('div');d.className='moneyFloat';d.style.left='50%';d.style.top='40%';d.textContent='-'+money(n);document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function popup(icon,title,body,cb,label='계속'){const scr=document.createElement('div');scr.className='scrim';const p=document.createElement('div');p.className='popup';p.innerHTML=`<div class="icon">${icon}</div><h2>${title}</h2><div class="body" style="font-size:13px">${body}</div><button>${label}</button>`;document.body.append(scr,p);p.querySelector('button').onclick=()=>{scr.remove();p.remove();if(cb)cb()}}
function confetti(){for(let i=0;i<34;i++){const d=document.createElement('div');d.className='confettiPiece';d.style.left=Math.random()*100+'vw';d.style.background=['#6d5ce8','#ffb21a','#17995a','#ef4852'][i%4];d.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}
function head(code,title,sub=''){return `<div class="eyebrow">${code}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function npc(e,t){return `<div class="npc"><div class="avatar">${e}</div><div class="bubble">${t}</div></div>`}
function choiceBind(el,fn){el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>fn(b.dataset.v,b))}
function retry(el,msg,scene){fx('bad');el.innerHTML=`<div class="narrator bad">${msg}</div><button class="primary" id="r">다시 판단하기</button>`;el.querySelector('#r').onclick=()=>go(scene,null,{skip:true})}
function miniUnlock(name,text,cb){
 popup('🔎','CASE LOG 업데이트',`<b>${name}</b><br>${text}<br><br><span class="tiny">자세한 법 개념은 게임 종료 후 CASE REVIEW에서 정리합니다.</span>`,cb,'다음 사건으로');
}
function eventBreak(el,o={}){
 const mode=o.mode||'notice';if(mode==='danger')fx('bad');if(mode==='good')fx('good');
 el.innerHTML=`<div class="eventBreak ${mode}">
 ${o.time?`<div class="eventTime">⏩ ${o.time}</div>`:''}
 <div class="eventIcon">${o.icon||'🚨'}</div><div class="eventLabel">${o.label||'NEW EVENT'}</div>
 <div class="eventTitle">${o.title||'새로운 사건 발생'}</div>
 ${o.alert?`<div class="eventAlert">${o.alert}</div>`:''}
 ${o.message?`<div class="eventMsg">${o.message}</div>`:''}
 ${o.question?`<div class="eventQ">${o.question}</div>`:''}
 <button class="primary" id="eventNext">${o.button||'상황 확인'}</button></div>`;
 el.querySelector('#eventNext').onclick=()=>typeof o.onNext==='function'?o.onNext():o.next?go(o.next):null
}

function phaseInfo(){
 if(S.mode==='review')return {label:`CASE REVIEW ${Math.min(S.reviewIndex+1,6)}/6`,pct:(S.reviewIndex/6)*100};
 let n=0,label='준비';
 if(['listing','pressureEvent','parallelFirst'].includes(S.scene))n=1,label='Stage 1 · 매물 선택';
 if(['registry','partyBoss','mortgageMeaning','mortgageDebtCheck','mortgagePlan'].includes(S.scene))n=2,label='Stage 2 · 등기부·권리관계';
 if(['contractDraft','contractEffect'].includes(S.scene))n=3,label='Stage 3 · 매매계약';
 if(['depositPay','cancelLab'].includes(S.scene))n=4,label='Stage 4 · 계약금';
 if(['midPay','performanceEvent','afterMid'].includes(S.scene))n=5,label='Stage 5 · 중도금';
 if(['balanceApproach','newMortgageEvent','newMortgageDetail','balanceBoss','clearanceProcess'].includes(S.scene))n=6,label='Stage 6 · 잔금 전';
 if(['transferDocs','deliveryCheck','paymentCompleteEvent'].includes(S.scene))n=7,label='Stage 7 · 잔금 Day';
 if(['ownershipShockEvent','ownershipQ','registerChoice','registerProcess','ownerChangeEvent'].includes(S.scene))n=8,label='Stage 8 · 소유권이전등기';
 if(['audit','bonusAudit','gameClear'].includes(S.scene))n=9,label='Final · 결과 확인';
 return {label,pct:Math.min(100,n/9*100)}
}
function hud(){

}

function reviewShell(r,i){
 return `<div class="reviewTop"><div class="reviewNo">CASE REVIEW ${i+1} / 6</div><div class="reviewTitle">${r.title}</div><div class="tiny">게임 장면 → 법으로 해석 → 3초 CHECK → 학습지</div></div>
 <div class="reviewScene"><b>🎮 게임 장면 다시 보기</b>${r.scene}</div>
 <div class="reviewTeach"><h3>📚 교과서로 보면</h3><div class="body" style="font-size:13.5px">${r.teach}</div></div>
 <div class="reviewRemember">⚡ 이것만 기억!<br>${r.remember}</div>
 <div class="reviewQuiz"><div class="q">3초 CHECK</div><div class="body" style="font-size:13.5px">${r.q}</div>
 <div class="choices">${r.options.map((o,j)=>`<button class="choice rq" data-i="${j}">${o[0]}</button>`).join('')}</div>
 <div class="feedback" id="rfb">${S.reviewDone[i]?`✅ 확인 완료 · ${S.reviewAttempts[i]||1}회 시도`:'정답을 확인하면 학습지 안내가 열립니다.'}</div></div>
 <div class="sheetCue" id="sheet" style="${S.reviewDone[i]?'':'display:none'}"><b>✎ 지금 학습지!</b><br>${r.sheet}</div>
 <div class="reviewNav"><button class="ghost" id="prev">${i===0?'게임 기록 보기':'← 이전 REVIEW'}</button><button class="primary" id="next" ${S.reviewDone[i]?'':'disabled'}>${i===5?'FINAL CHECK':'다음 REVIEW →'}</button></div>`;
}

SC.review=el=>{
 S.mode='review';const i=S.reviewIndex,reviews=getReviews(),r=reviews[i];
 el.innerHTML=reviewShell(r,i);
 el.querySelectorAll('.rq').forEach(b=>b.onclick=()=>{
   const o=r.options[Number(b.dataset.i)],fb=el.querySelector('#rfb');
   if(S.reviewDone[i]){
     fb.className='feedback ok';fb.textContent=`✅ 이미 정답 확인 완료 · ${S.reviewAttempts[i]||1}회 시도`;
     return;
   }
   S.reviewAttempts[i]=(S.reviewAttempts[i]||0)+1;
   if(o[1]){
     S.reviewDone[i]=true;S.reviewAnswers[i]=Number(b.dataset.i);save();
     fb.className='feedback ok';fb.textContent=`✅ 정답 · ${S.reviewAttempts[i]||1}회 시도. 이제 학습지의 해당 부분을 채우세요.`;
     el.querySelector('#sheet').style.display='block';el.querySelector('#next').disabled=false;
   }else{
     save();
     fb.className='feedback no';fb.textContent=`❌ ${S.reviewAttempts[i]}회째 시도. 바로 위 “교과서로 보면”에서 핵심 문장을 찾아보세요.`;
   }
 });
 el.querySelector('#prev').onclick=()=>{
   if(i===0)go('reviewRecord',null,{skip:true});
   else{S.reviewIndex--;save();render();window.scrollTo(0,0)}
 };
 el.querySelector('#next').onclick=()=>{
   if(i===5)go('reviewFinal',null,{skip:true});
   else{S.reviewIndex++;save();render();window.scrollTo(0,0)}
 };
};

SC.reviewRecord=el=>{
 const v=LISTINGS[S.selectedListing]||{name:'-'};
 const dangerRows=[
  ['권리관계 확인 전 선송금','BE00'],['계약서 주소 오류','BE01'],['대리권 미확인','BE02'],['근저당 처리 무시','BE03'],['잔금 전 재확인 생략','BE04'],['등기 지연','BE05']
 ];
 const direct=S.reviewEntry==='direct';
 el.innerHTML=head('PART B',direct?'CASE REVIEW 바로가기':'내 플레이 기록',direct?'이미 게임을 한 친구는 기록 없이도 핵심 장면을 바로 복습할 수 있습니다.':'CASE REVIEW는 방금 한 플레이를 법률 언어로 번역하는 단계입니다.')+
 `${direct
   ?`<div class="panel purple"><b>📚 직접 복습 모드</b><div class="body" style="font-size:13px">이 브라우저에 이번 게임 기록이 없어도 괜찮습니다. 각 REVIEW에서 <b>게임의 핵심 장면을 다시 제시</b>합니다.</div></div>`
   :`<div class="panel dark"><div class="stat"><span>선택 매물</span><b>${v.name}</b></div><div class="stat"><span>BAD END</span><b>${S.badEnds.length}</b></div><div class="stat"><span>환생</span><b>${S.reincarnations}</b></div></div>
     <div class="recordgrid">${dangerRows.map(x=>`<div class="record"><b>${S.badEnds.includes(x[1])?'☠ 경험한 위험':'🛡 피한 위험'}</b><span>${x[0]}</span></div>`).join('')}</div>`}
 <div class="narrator">${direct?'게임을 이미 했다면 이제 <b>왜 그 선택이 중요했는지</b> 법 개념으로 정리합니다.':'BAD END를 보지 않았어도 괜찮습니다. REVIEW에서는 <b>성공한 선택과 실패세계 모두의 의미</b>를 확인합니다.'}</div>
 <button class="primary" id="go">CASE REVIEW 1 시작</button>`;
 el.querySelector('#go').onclick=()=>{S.reviewIndex=0;S.scene='review';save();render()}
};

const ORDER=['매물 선택','계약 전 등기부 확인','매매계약','계약금·중도금 지급','잔금 전 최신 등기부 확인','잔금·서류·부동산 인수','소유권이전등기'];
SC.reviewFinal=el=>{
 const remain=ORDER.filter(x=>!S.reviewOrder.includes(x));
 const complete=S.reviewOrder.length===ORDER.length;
 el.innerHTML=head('PART B · FINAL','매매 절차를 내 손으로 복구하라','카드를 “먼저 하는 것”부터 눌러 순서를 완성하세요.')+
 `<div class="panel"><h3>내가 만든 순서</h3><div class="orderbuilt">${S.reviewOrder.length?S.reviewOrder.map((x,i)=>`<div class="orderitem built" data-i="${i}">${i+1}. ${x}</div>`).join(''):'<div class="tiny">아직 선택하지 않았습니다.</div>'}</div></div>
 <div class="panel"><h3>남은 카드</h3><div class="orderpool">${remain.map(x=>`<div class="orderitem pick" data-v="${x}">${x}</div>`).join('')}</div></div>
 <div class="feedback" id="ofb"></div>
 <button class="primary" id="judge" ${complete?'':'disabled'}>순서 제출</button><button class="ghost" id="clear">순서 다시 만들기</button>`;
 el.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{S.reviewOrder.push(b.dataset.v);save();render()});
 el.querySelectorAll('.built').forEach(b=>b.onclick=()=>{S.reviewOrder.splice(Number(b.dataset.i),1);save();render()});
 el.querySelector('#clear').onclick=()=>{S.reviewOrder=[];save();render()};
 if(complete)el.querySelector('#judge').onclick=()=>{
   const ok=ORDER.every((x,i)=>S.reviewOrder[i]===x);
   if(ok)go('reviewFinalQuiz',null,{skip:true});
   else{
     el.querySelector('#ofb').className='feedback no';
     el.querySelector('#ofb').textContent='❌ 순서가 섞였습니다. 계약 전에 무엇을 확인했는지, 소유권은 언제 취득하는지 다시 떠올려 보세요.';
     S.reviewOrder=[];save();setTimeout(render,1200)
   }
 };
};

SC.reviewFinalQuiz=el=>{
 const qs=[
  {q:'① 은행의 근저당권을 확인하는 곳은?',a:'을구',opts:['표제부','갑구','을구']},
  {q:'② 매매계약이 성립하면 바로 부동산 소유권을 취득한다.',a:'X',opts:['O','X']},
  {q:'③ 게임과 교과서 사례에서 소유권 취득 시점은?',a:'소유권이전등기 완료',opts:['계약 체결','잔금 지급','소유권이전등기 완료']}
 ];
 let ans=S.reviewAnswers.final||{};
 el.innerHTML=head('FINAL CHECK','마지막 3문제','세 문제를 모두 맞히면 CASE REVIEW가 끝납니다.')+
 qs.map((x,i)=>`<div class="finalQ"><b>${x.q}</b><div class="choices">${x.opts.map(o=>`<button class="choice fq" data-q="${i}" data-v="${o}">${o}</button>`).join('')}</div><div class="feedback" id="f${i}">${ans[i]===true?'✅ 정답':''}</div></div>`).join('')+
 `<button class="primary" id="finish" ${[0,1,2].every(i=>ans[i]===true)?'':'disabled'}>CASE REVIEW 완료</button>`;
 el.querySelectorAll('.fq').forEach(b=>b.onclick=()=>{
   const i=Number(b.dataset.q),correct=b.dataset.v===qs[i].a;
   if(!S.reviewAnswers.final)S.reviewAnswers.final={};
   if(S.reviewAnswers.final[i]===true){
     const f=el.querySelector('#f'+i);
     f.className='feedback ok';f.textContent=`✅ 이미 정답 확인 완료 · ${S.finalAttempts[i]||1}회 시도`;
     return;
   }
   S.finalAttempts[i]=(S.finalAttempts[i]||0)+1;
   S.reviewAnswers.final[i]=correct;save();
   const f=el.querySelector('#f'+i);
   f.className='feedback '+(correct?'ok':'no');
   f.textContent=correct?`✅ 정답 · ${S.finalAttempts[i]||1}회 시도`:`❌ ${S.finalAttempts[i]}회째 시도 · 관련 REVIEW 내용을 다시 떠올려 보세요.`;
   if([0,1,2].every(j=>S.reviewAnswers.final[j]===true))el.querySelector('#finish').disabled=false
 });
 el.querySelector('#finish').onclick=()=>go('reviewComplete',null,{skip:true});
};

SC.reviewComplete=el=>{
 confetti();
 const reviews=getReviews();
 const weak=reviews.map((r,i)=>({title:r.title,tries:S.reviewAttempts[i]||0})).filter(x=>x.tries>=2);
 const attemptRows=reviews.map((r,i)=>`<div class="stat"><span>REVIEW ${i+1} · ${r.title}</span><b>${S.reviewAttempts[i]||0}회</b></div>`).join('');
 el.innerHTML=`<div class="clear"><div class="cup">🎓</div><div class="eyebrow">PART B CLEAR</div><h1>CASE REVIEW COMPLETE</h1>
 <p class="sub">게임에서 한 행동이 이제 법률 개념으로 연결되었습니다.</p></div>
 <div class="panel good"><h3>🏠 부동산 매매 핵심</h3>
 <div class="timeline">${ORDER.map((x,i)=>`<div class="step"><div class="n">${i+1}</div><div>${x}</div></div>`).join('')}</div></div>
 <div class="panel"><h3>딱 세 줄만 남기기</h3>
 <div class="body" style="font-size:13.5px">① <b>표제부</b>는 부동산 자체, <b>갑구</b>는 소유권, <b>을구</b>는 저당권 등 다른 권리를 확인한다.<br><br>
 ② 계약 후에도 권리관계가 달라질 수 있으므로 <b>잔금 전 최신 등기부</b>를 다시 확인한다.<br><br>
 ③ 부동산은 매매계약만으로 소유권을 취득하는 것이 아니라 <b>소유권이전등기를 완료해야</b> 한다.</div></div>
 <div class="panel blue"><h3>📊 나의 CASE REVIEW 기록</h3>${attemptRows}
 ${weak.length?`<div class="narrator bad"><b>⚠ 한 번 더 볼 개념</b><br>${weak.map(x=>`• ${x.title} (${x.tries}회 시도)`).join('<br>')}</div>`:`<div class="narrator good"><b>✅ 모든 REVIEW를 1회 시도 안에 해결했습니다.</b></div>`}</div>
 <div class="sheetCue"><b>✎ 학습지 마무리</b><br>남아 있는 빈칸과 마지막 3문제를 완성하고, 매매 절차 6~7단계를 소리 내어 한 번 읽어 보세요.</div>
 <button class="primary" id="game">게임 첫 화면으로</button><button class="ghost" id="review">CASE REVIEW 다시 보기</button>`;
 el.querySelector('#game').onclick=()=>{S.mode='game';S.scene='title';H=[];save();render()};
 el.querySelector('#review').onclick=()=>{S.mode='review';S.reviewIndex=0;S.scene='review';H=[];save();render()}
};

function render(){
 hud();
 const el=document.querySelector('#stage');el.innerHTML='';
 const fn=SC[S.scene]||SC.title;fn(el);
}
render();
</script>
</body>
</html>
