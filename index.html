<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HOUSE FILE — GAME 1 BUY THE HOUSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap');

:root{
  --cream:#fff6e8;
  --paper:#fff;
  --ink:#241f2b;
  --soft:#6b6474;
  --line:#eadfce;
  --purple:#6d5ce8;
  --purple2:#4939bd;
  --green:#17995a;
  --greenbg:#ebfaf2;
  --red:#ef4852;
  --redbg:#fff0f1;
  --amber:#ffb21a;
  --amberbg:#fff6d9;
  --blue:#2d78c9;
  --shadow:0 7px 0 rgba(36,31,43,.09);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
  background:
    radial-gradient(circle at 10% 0,#fff1d8,transparent 35%),
    radial-gradient(circle at 100% 90%,#eee9ff,transparent 35%),
    var(--cream);
  color:var(--ink);
  font-family:'Gowun Dodum',sans-serif;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

button{font:inherit;color:inherit}

#app{
  width:100%;
  max-width:560px;
  min-height:100vh;
  background:var(--paper);
  box-shadow:0 0 60px rgba(36,31,43,.1);
  overflow:hidden;
  position:relative;
}

#hud{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--ink);
  color:#fff;
  border-bottom:4px solid var(--amber);
  padding:9px 12px;
}

.hud1,.hud2{
  display:flex;
  align-items:center;
  gap:7px;
}

.hud2{
  margin-top:6px;
  flex-wrap:wrap;
}

.stage{
  font:700 11px 'IBM Plex Mono';
  color:#ffe7aa;
  flex:1;
}

.cash{
  font:700 18px 'IBM Plex Mono';
  color:#83f7b3;
}

.pill{
  font-size:10.5px;
  background:rgba(255,255,255,.1);
  padding:3px 7px;
  border-radius:999px;
}

.hbtn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.09);
  color:#fff;
  border-radius:8px;
  padding:5px 7px;
  font-size:10.5px;
  cursor:pointer;
}

.hbtn:disabled{opacity:.3}

#stage{
  padding:22px 18px 48px;
  min-height:calc(100vh - 78px);
  animation:sceneIn .35s ease;
}

.brand{font-family:'Gaegu',cursive}

.eyebrow{
  font:700 11px 'IBM Plex Mono';
  color:var(--purple);
}

h1{
  font:700 29px 'Gaegu';
  margin:4px 0 6px;
  line-height:1.15;
}

.sub{
  font-size:13.5px;
  color:var(--soft);
  line-height:1.55;
  margin:0 0 16px;
}

.body{
  font-size:15px;
  line-height:1.75;
}

.tiny{
  font-size:11.5px;
  color:var(--soft);
  line-height:1.55;
}

.hero{
  text-align:center;
  padding:18px 0;
}

.hero .emoji{font-size:56px}

.panel{
  border:2px solid var(--line);
  border-radius:15px;
  padding:13px;
  margin:12px 0;
  background:#fff;
}

.panel.dark{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.panel.warn{
  background:var(--amberbg);
  border-color:#efd387;
}

.panel.bad{
  background:var(--redbg);
  border-color:#f2b8bd;
}

.panel.good{
  background:var(--greenbg);
  border-color:#bce7cd;
}

.narrator{
  border-left:4px solid var(--purple);
  background:#f1eeff;
  border-radius:10px;
  padding:11px 13px;
  margin:13px 0;
  font-size:14px;
  line-height:1.6;
}

.narrator.bad{
  border-color:var(--red);
  background:var(--redbg);
}

.narrator.good{
  border-color:var(--green);
  background:var(--greenbg);
}

.npc{
  display:flex;
  gap:9px;
  margin:13px 0;
}

.avatar{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffe2a6;
  border-radius:12px;
  flex:none;
  font-size:20px;
}

.bubble{
  border:2px solid var(--line);
  background:#fffaf0;
  border-radius:14px 14px 14px 3px;
  padding:10px 12px;
  font-size:14px;
  line-height:1.55;
}

.choices{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}

.choice{
  border:2px solid var(--ink);
  background:#fff;
  border-radius:14px;
  padding:13px 14px;
  text-align:left;
  box-shadow:var(--shadow);
  cursor:pointer;
  font-size:14px;
}

.choice:active,.primary:active{
  transform:translateY(3px);
  box-shadow:none;
}

.choice small{
  display:block;
  color:var(--soft);
  font-size:11.5px;
  margin-top:4px;
  line-height:1.45;
}

.primary{
  width:100%;
  border:none;
  border-radius:14px;
  background:var(--purple);
  color:white;
  font-weight:700;
  padding:14px;
  margin-top:15px;
  box-shadow:0 6px 0 var(--purple2);
  cursor:pointer;
}

.primary:disabled{
  background:#cfc9db;
  box-shadow:0 6px 0 #b5aec2;
}

.ghost{
  width:100%;
  border:2px dashed var(--purple);
  background:#fff;
  color:var(--purple);
  font-weight:700;
  border-radius:13px;
  padding:10px;
  margin-top:9px;
  cursor:pointer;
}

.moneycard{
  background:var(--ink);
  color:#fff;
  border-radius:16px;
  padding:15px 17px;
  margin:13px 0;
}

.moneycard .label{
  font-size:11px;
  opacity:.7;
}

.moneycard .amt{
  font:700 25px 'IBM Plex Mono';
  margin-top:3px;
}

.moneycard.loss .amt{color:#ff858d}
.moneycard.gain .amt{color:#86f4b3}

.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 1px;
  border-bottom:1px dashed var(--line);
  font-size:13px;
}

.stat b{
  font-family:'IBM Plex Mono';
  text-align:right;
}

.tabs{
  display:flex;
  gap:6px;
  margin:12px 0;
}

.tab{
  flex:1;
  border:2px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:9px 4px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.tab.on{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

.tab.done:after{
  content:' ✓';
  color:#7dffae;
}

.checkitem{
  display:flex;
  gap:9px;
  padding:10px 0;
  border-bottom:1px dashed var(--line);
  cursor:pointer;
}

.checkitem:last-child{border-bottom:none}

.box{
  width:20px;
  height:20px;
  border:2px solid var(--ink);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.checkitem.done .box{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}

.checkitem b{
  display:block;
  font-size:13px;
}

.checkitem span{
  font-size:11.5px;
  color:var(--soft);
}

.parallel{
  background:#17132c;
  color:#fff;
  border-radius:18px;
  padding:20px;
  margin:12px 0;
}

.parallel h2{
  font-family:'Gaegu';
  font-size:24px;
  color:#c6bbff;
  margin:4px 0;
}

.parallel p{
  font-size:13px;
  line-height:1.7;
  color:#e4def1;
}

.badend{
  background:#1b1117;
  color:#fff;
  margin:-22px -18px -48px;
  padding:38px 22px;
  min-height:calc(100vh - 74px);
  text-align:center;
}

.badend .skull{font-size:56px}
.badend h1{color:#ff6972}

.badend p{
  text-align:left;
  font-size:13px;
  line-height:1.7;
}

.retry{
  width:100%;
  border:none;
  border-radius:14px;
  background:#ff6972;
  color:#24131a;
  font-weight:700;
  padding:14px;
  margin-top:16px;
  cursor:pointer;
}

.concept{
  border:2px solid var(--amber);
  background:#fff8df;
  border-radius:14px;
  padding:12px;
  margin:12px 0;
  font-size:12.5px;
  line-height:1.65;
}

.audit{
  display:flex;
  gap:9px;
  align-items:flex-start;
  border-bottom:1px dashed var(--line);
  padding:10px 0;
  cursor:pointer;
}

.audit:last-child{border-bottom:none}

.audit.done .box{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.clear{text-align:center}
.cup{font-size:56px}

.tag{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  border-radius:6px;
  padding:2px 6px;
  font:700 10px 'IBM Plex Mono';
  margin-right:7px;
}

/* FX */

#fxLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
}

.flashRed{animation:redFlash .55s ease}
.flashGreen{animation:greenFlash .55s ease}
.screenShake{animation:shake .38s ease}
.screenZoom{animation:zoomHit .55s ease}
.pulseBig{animation:pulseBig .65s ease}

.moneyFloat{
  position:fixed;
  z-index:240;
  font:700 30px 'IBM Plex Mono';
  color:#ff5964;
  text-shadow:0 2px 0 #fff;
  animation:moneyFly 1.1s ease forwards;
  pointer-events:none;
}

.popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.75);
  width:min(88vw,430px);
  background:#fff;
  border:3px solid var(--ink);
  border-radius:20px;
  padding:18px;
  z-index:230;
  box-shadow:0 18px 0 rgba(36,31,43,.18);
  animation:popupIn .28s cubic-bezier(.18,.8,.32,1.3) forwards;
}

.popup h2{
  font-family:'Gaegu';
  font-size:26px;
  margin:0 0 6px;
}

.popup .icon{
  font-size:42px;
  text-align:center;
}

.popup button{
  width:100%;
  margin-top:12px;
  border:none;
  border-radius:12px;
  padding:12px;
  background:var(--purple);
  color:white;
  font-weight:700;
}

.scrim{
  position:fixed;
  inset:0;
  background:rgba(20,16,28,.55);
  z-index:220;
  animation:fade .2s ease;
}

.confettiPiece{
  position:fixed;
  top:-20px;
  width:10px;
  height:16px;
  border-radius:3px;
  z-index:260;
  animation:fall 1.8s linear forwards;
}

.lockBurst{
  position:fixed;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  font-size:52px;
  z-index:250;
  animation:unlockBurst .8s ease forwards;
}

@keyframes sceneIn{
  from{opacity:0;transform:translateY(8px) scale(.99)}
  to{opacity:1;transform:none}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(4px)}
}

@keyframes zoomHit{
  0%{transform:scale(1)}
  45%{transform:scale(1.045)}
  100%{transform:scale(1)}
}

@keyframes pulseBig{
  0%{transform:scale(1)}
  50%{transform:scale(1.12)}
  100%{transform:scale(1)}
}

@keyframes redFlash{
  0%{box-shadow:inset 0 0 0 0 rgba(255,60,70,0)}
  30%{box-shadow:inset 0 0 0 999px rgba(255,60,70,.16)}
  100%{box-shadow:inset 0 0 0 0 rgba(255,60,70,0)}
}

@keyframes greenFlash{
  0%{box-shadow:inset 0 0 0 0 rgba(40,200,100,0)}
  30%{box-shadow:inset 0 0 0 999px rgba(40,200,100,.13)}
  100%{box-shadow:inset 0 0 0 0 rgba(40,200,100,0)}
}

@keyframes popupIn{
  to{transform:translate(-50%,-50%) scale(1)}
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

@keyframes moneyFly{
  0%{opacity:0;transform:translate(-50%,20px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-90px) scale(.95)}
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg)}
}

@keyframes unlockBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
}

/* GAME 1 V6 EVENT / BOSS */

.eventBreak{
  min-height:62vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  padding:24px 4px;
  position:relative;
}

.eventBreak:before{
  content:'';
  position:absolute;
  inset:-22px -18px -48px;
  z-index:-1;
  background:radial-gradient(circle at center,#fff 0,#fff 40%,#f5f0e8 100%);
}

.eventBreak.danger:before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#ffe6e8 100%);
}

.eventBreak.good:before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#e7f8ee 100%);
}

.eventBreak.notice:before{
  background:radial-gradient(circle at center,#fff 0,#fff 38%,#eeeaff 100%);
}

.eventTime{
  display:inline-block;
  align-self:center;
  font:700 11px 'IBM Plex Mono';
  background:#f4efe6;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  margin-bottom:17px;
  color:var(--soft);
}

.eventIcon{
  font-size:58px;
  animation:eventDrop .55s cubic-bezier(.2,.9,.25,1.25);
}

.eventLabel{
  font:700 11px 'IBM Plex Mono';
  letter-spacing:.1em;
  color:var(--red);
  margin-top:11px;
}

.eventBreak.good .eventLabel{color:var(--green)}
.eventBreak.notice .eventLabel{color:var(--purple)}

.eventTitle{
  font:700 35px 'Gaegu';
  line-height:1.08;
  margin:6px 0 10px;
}

.eventAlert{
  border:2px solid var(--red);
  background:#fff;
  border-radius:15px;
  padding:11px 13px;
  margin:10px 0;
  text-align:left;
  box-shadow:var(--shadow);
  animation:eventPulse .7s ease;
}

.eventBreak.good .eventAlert{
  border-color:var(--green);
}

.eventAlert .source{
  font:700 10px 'IBM Plex Mono';
  color:var(--soft);
  margin-bottom:4px;
}

.eventMsg{
  background:#fff;
  border:2px solid var(--line);
  border-radius:15px;
  padding:12px 13px;
  font-size:13.5px;
  line-height:1.65;
}

.eventQ{
  font:700 20px 'Gaegu';
  margin:14px 3px 0;
  line-height:1.35;
}

.bossbar{
  height:11px;
  background:#eee6d8;
  border-radius:999px;
  overflow:hidden;
  margin:11px 0;
}

.bossbar>div{
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--green));
  transition:width .35s;
}

.lockgrid{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  margin:12px 0;
}

.lockcard{
  border:2px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:#fff;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
}

.lockcard.on{
  border-color:var(--green);
  background:var(--greenbg);
}

.lockcard .ico{font-size:26px}

.lockcard b{
  display:block;
  font-size:13px;
}

.lockcard span{
  font-size:11px;
  color:var(--soft);
}

.lockbtn{
  border:none;
  background:var(--ink);
  color:#fff;
  border-radius:9px;
  padding:8px 9px;
  font-size:11px;
  cursor:pointer;
}

.lockcard.on .lockbtn{
  background:var(--green);
}

.phasebar{
  height:7px;
  background:#eee6d8;
  border-radius:999px;
  overflow:hidden;
  flex-basis:100%;
  margin-top:2px;
}

.phasebar>div{
  height:100%;
  background:linear-gradient(90deg,var(--amber),var(--green));
  transition:width .3s;
}

.processStep{
  border:2px solid var(--line);
  border-radius:13px;
  padding:11px;
  margin:8px 0;
  display:flex;
  gap:9px;
  align-items:center;
}

.processStep.done{
  border-color:var(--green);
  background:var(--greenbg);
}

.processStep .num{
  width:28px;
  height:28px;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font:700 11px 'IBM Plex Mono';
  flex:none;
}

.ownerFlip{
  font:700 24px 'IBM Plex Mono';
  padding:16px;
  text-align:center;
  border:2px solid var(--line);
  border-radius:15px;
  background:#fff;
}

.ownerFlip .old{
  text-decoration:line-through;
  color:var(--soft);
}

.ownerFlip .new{
  color:var(--green);
  font-size:30px;
}

.scanline{
  font:700 11px 'IBM Plex Mono';
  color:var(--purple);
  letter-spacing:.08em;
}

.scanpulse{
  animation:scanPulse .75s ease infinite alternate;
}

@keyframes eventDrop{
  0%{opacity:0;transform:translateY(-35px) scale(.55)}
  65%{opacity:1;transform:translateY(5px) scale(1.15)}
  100%{transform:none}
}

@keyframes eventPulse{
  0%{opacity:.2;transform:scale(.94)}
  50%{opacity:1;transform:scale(1.025)}
  100%{transform:scale(1)}
}

@keyframes scanPulse{
  from{opacity:.35}
  to{opacity:1}
}

@media(max-width:460px){
  #stage{padding-left:14px;padding-right:14px}
  .badend{margin-left:-14px;margin-right:-14px}
  h1{font-size:26px}
}
</style>
</head>

<body>

<div id="app">
  <header id="hud"></header>
  <main id="stage"></main>
</div>

<div id="fxLayer"></div>

<script>
'use strict';

const STORE='HOUSE_FILE_GAME1_V6';
const HIST='HOUSE_FILE_GAME1_V6_H';

const C={
  startCash:320000000,
  price:300000000,
  deposit:30000000,
  mid:120000000,
  balance:150000000,

  address:
    '서울시 해솔구 독립로 17 / 101동 703호 / 전용 59㎡',

  wrongAddress:
    '101동 307호 / 전용 49㎡',

  owner:'김민수',
  counterparty:'박현우',

  mortgageMax:220000000,
  newMortgageMax:120000000,
  newMortgageBank:'B저축은행'
};

const BAD={

  BE01:{
    title:'주소 한 칸을 놓쳤습니다',
    loss:20000000,
    checkpoint:'contractDraft',
    story:
      '계약서에는 101동 307호가 적혀 있었지만 실제로 본 집은 101동 703호였습니다. 목적물을 바로잡지 않은 채 계약해 분쟁이 발생했습니다.'
  },

  BE02:{
    title:'형이라고 다 대리인은 아니었습니다',
    loss:25000000,
    checkpoint:'partyBoss',
    story:
      '등기부상 소유자는 김민수인데 계약하러 나온 박현우의 대리권을 확인하지 않았습니다. 가족이라는 설명만 믿고 계약금을 지급한 실패세계입니다.'
  },

  BE03:{
    title:'을구를 봤지만 그냥 지나쳤습니다',
    loss:270000000,
    checkpoint:'mortgagePlan',
    story:
      '선순위 근저당권을 확인하고도 말소조건 없이 거래를 진행했습니다. 이 게임의 경매세계에서는 은행이 먼저 변제받아 큰 손실이 발생합니다.'
  },

  BE04:{
    title:'잔금 버튼부터 눌렀습니다',
    loss:170000000,
    checkpoint:'balanceApproach',
    story:
      '중도금 지급 뒤 새 근저당권이 설정됐지만 잔금 직전 최신 등기부와 권리변동을 확인하지 않고 송금을 진행한 실패세계입니다.'
  },

  BE05:{
    title:'돈은 냈는데 집은 남의 것',
    loss:260000000,

let S=load();
let H=loadH();

function clone(x){
  return JSON.parse(
    JSON.stringify(x)
  );
}

function load(){
  try{
    return Object.assign(
      clone(DEF),
      JSON.parse(
        localStorage.getItem(STORE)||'{}'
      )
    );
  }
  catch(e){
    return clone(DEF);
  }
}

function loadH(){
  try{
    return JSON.parse(
      localStorage.getItem(HIST)||'[]'
    );
  }
  catch(e){
    return [];
  }
}

function save(){
  localStorage.setItem(
    STORE,
    JSON.stringify(S)
  );

  localStorage.setItem(
    HIST,
    JSON.stringify(H)
  );
}

function money(n){
  return '₩'+
    Math.round(n||0)
    .toLocaleString('ko-KR');
}

function unlock(x){
  if(!S.concepts.includes(x)){
    S.concepts.push(x);
  }
}

function snap(){
  H.push(
    clone(S)
  );

  if(H.length>35){
    H.shift();
  }
}

function go(
  id,
  mut=null,
  opt={}
){
  if(!opt.skip){
    snap();
  }

  if(mut){
    mut();
  }

  S.scene=id;

  save();
  render();

  window.scrollTo(0,0);
}

function back(){
  if(!H.length){
    return;
  }

  S=H.pop();

  save();
  render();

  window.scrollTo(0,0);
}

function setCP(x){
  S.checkpoint=x;
}

function reset(){
  if(
    confirm(
      'GAME 1 진행 상황을 초기화할까요?'
    )
  ){
    localStorage.removeItem(STORE);
    localStorage.removeItem(HIST);

    S=clone(DEF);
    H=[];

    render();
  }
}

function recordBad(code){
  if(
    !S.badEnds.includes(code)
  ){
    S.badEnds.push(code);

    S.lossLedger[code]=
      BAD[code].loss;
  }
}

function bad(code){
  recordBad(code);

  S.activeBad=code;

  S.checkpoint=
    BAD[code].checkpoint;

  save();

  fx('bad');

  setTimeout(
    ()=>go(
      'badend',
      null,
      {skip:true}
    ),
    240
  );
}

function reincarnate(){
  S.reincarnations++;

  S.scene=
    S.checkpoint;

  S.activeBad=null;
  H=[];

  save();
  render();
}

function fx(type){
  const a=
    document.querySelector('#app');

  a.classList.remove(
    'screenShake',
    'screenZoom',
    'flashRed',
    'flashGreen'
  );

  void a.offsetWidth;

  if(type==='bad'){
    a.classList.add(
      'screenShake',
      'flashRed'
    );
  }

  if(type==='good'){
    a.classList.add(
      'screenZoom',
      'flashGreen'
    );
  }
}

function moneyFx(n){
  const d=

  d.style.left='50%';
  d.style.top='40%';

    '-'+money(n);

  document.body.appendChild(d);

  setTimeout(

    1200
  );
}

function popup(
  icon,
  title,
  body,
  cb,
  label='계속'
){
  const scr=
    document.createElement('div');

  scr.className='scrim';

  const p=
    document.createElement('div');

  p.className='popup';

  p.innerHTML=`
    <div class="icon">
      ${icon}
    </div>

    <h2>
      ${title}
    </h2>

    <div
      class="body"
      style="font-size:13px"
    >
      ${body}
    </div>

    <button>
      ${label}
    </button>
  `;

  document.body.append(
    scr,
    p
  );

  p.querySelector('button').onclick=()=>{
    scr.remove();
    p.remove();

    if(cb){
      cb();
    }
  };
}

  );
}

function phaseInfo(){

  let n=0;
  let label='매물 탐색';

  if(
    Object.keys(S.regTicks).length
  ){
    n=1;
    label='권리 수사';
  }

  if(S.contractFixed){
    n=2;
    label='계약 체결';
  }

  if(S.paid.deposit){
    n=3;
    label='계약금';
  }

  if(S.paid.mid){
    n=4;
    label='이행 착수';
  }

  if(
    S.newMortgageFound ||
    Object.values(S.balanceLocks)
    .some(Boolean)
  ){
    n=5;
    label='잔금 BOSS';
  }

  if(S.paid.balance){
    n=6;
    label='등기 대기';
  }

  if(S.registered){
    n=7;
    label='소유권 확보';
  }

  return {
    n,
    label,
    pct:n/7*100
  };
}

function eventBreak(
  el,
  o={}
){

  const mode=
    o.mode||'notice';

  if(mode==='danger'){
    fx('bad');
  }

  if(mode==='good'){
    fx('good');
  }

  el.innerHTML=`
    <div class="eventBreak ${mode}">

      ${
        o.time
        ?
        `<div class="eventTime">
          ⏩ ${o.time}
        </div>`
        :
        ''
      }

      <div class="eventIcon">
        ${o.icon||'🚨'}
      </div>

      <div class="eventLabel">
        ${o.label||'NEW EVENT'}
      </div>

      <div class="eventTitle">
        ${o.title||'새로운 사건 발생'}
      </div>

      ${
        o.alert
        ?
        `<div class="eventAlert">
          ${o.alert}
        </div>`
        :
        ''
      }

      ${
        o.message
        ?
        `<div class="eventMsg">
          ${o.message}
        </div>`
        :
        ''
      }

      ${
        o.question
        ?
        `<div class="eventQ">
          ${o.question}
        </div>`
        :
        ''
      }

      <button
        class="primary"
        id="eventNext"
      >
        ${o.button||'상황 확인'}
      </button>

    </div>
  `;

  el.querySelector(
    '#eventNext'
  ).onclick=()=>{

    if(
      typeof o.onNext===
      'function'
    ){
      o.onNext();
    }
    else if(o.next){
      go(o.next);
    }
  };
}

    </div>

    <button
      class="primary"
      id="done"
      ${all?'':'disabled'}
    >
      ${
        all
        ?
        '🔐 PROPERTY SECURED'
        :
        '세 영역을 모두 스캔하세요'
      }
    </button>

    <div class="tiny">

      ※ 잔금일에는
      말소·이전 절차를
      동시 진행하도록 준비했고,

      여기서는 완료된 등기부를
      다시 검수하는 단계입니다.

    </div>
  `;

  el.querySelectorAll(
    '[data-k]'
  ).forEach(b=>{

    b.onclick=()=>{

      const k=
        b.dataset.k;

      if(
        a[k] ||
        S.auditScanning
      ){
        return;
      }

      S.auditScanning=k;

      save();
      render();

      setTimeout(
        ()=>{

          S.audit[k]=true;

          S.auditScanning=null;

          save();

          fx('good');

          render();

        },
        650
      );
    };

  });

  const d=
    el.querySelector('#done');

  if(d){

    d.onclick=
      ()=>go(
        'bonusAudit'
      );
  }
};

/* BONUS */

SC.bonusAudit=el=>{

  el.innerHTML=
    head(
      'BONUS CHECK',
      '등기부만 믿으면 100% 안전?',
      '마지막 함정입니다.'
    )
    +
    `
    <div class="choices">

      <button
        class="choice"
        data-v="yes"
      >
        O — 등기부에 적혀 있으면
        언제나 진실이므로
        무조건 보호된다
      </button>

      <button
        class="choice"
        data-v="no"
      >
        X — 등기는 매우 중요하지만
        우리 법은 부동산등기의
        공신력을 일반적으로 인정하지 않는다
      </button>

    </div>
  `;

  choiceBind(
    el,
    v=>
      v==='no'
      ?
      concept(
        '등기의 공신력은 일반적으로 부정',
        '등기부 확인은 필수지만 등기만 믿었다는 이유만으로 언제나 진정한 권리관계와 무관하게 보호되는 것은 아닙니다. 거래상대방·서류·권리관계를 함께 확인해야 합니다.',
        ()=>go('clear')
      )
      :
      retry(
        el,
        '❌ 등기부는 핵심 자료지만 “적혀 있으면 무조건 100% 진실”이라는 뜻은 아닙니다.',
        'bonusAudit'
      )
  );
};

    <div class="panel dark">

    <div class="narrator good">

      <b>

  `;

  el.querySelector('#again').onclick=
    reset;
};

/* BAD END */

    document.querySelector('#stage');
