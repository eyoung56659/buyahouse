*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:radial-gradient(circle at 10% 0,#fff1d8,transparent 35%),radial-gradient(circle at 100% 90%,#eee9ff,transparent 35%),var(--cream);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;min-height:100vh}button{font:inherit;color:inherit}#app{width:100%;max-width:560px;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(36,31,43,.1);overflow:hidden;position:relative}#hud{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;border-bottom:4px solid var(--amber);padding:9px 12px}.hud1,.hud2{display:flex;align-items:center;gap:7px}.hud2{margin-top:6px;flex-wrap:wrap}.stage{font:700 11px 'IBM Plex Mono';color:#ffe7aa;flex:1}.cash{font:700 18px 'IBM Plex Mono';color:#83f7b3}.pill{font-size:10.5px;background:rgba(255,255,255,.1);padding:3px 7px;border-radius:999px}.hbtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:5px 7px;font-size:10.5px;cursor:pointer}.hbtn:disabled{opacity:.3}#stage{padding:22px 18px 48px;min-height:calc(100vh - 78px);animation:sceneIn .35s ease}.brand{font-family:'Gaegu',cursive}.eyebrow{font:700 11px 'IBM Plex Mono';color:var(--purple)}h1{font:700 29px 'Gaegu';margin:4px 0 6px;line-height:1.15}.sub{font-size:13.5px;color:var(--soft);line-height:1.55;margin:0 0 16px}.body{font-size:15px;line-height:1.75}.tiny{font-size:11.5px;color:var(--soft);line-height:1.55}.hero{text-align:center;padding:18px 0}.hero .emoji{font-size:56px}.panel{border:2px solid var(--line);border-radius:15px;padding:13px;margin:12px 0;background:#fff}.panel.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.panel.warn{background:var(--amberbg);border-color:#efd387}.panel.bad{background:var(--redbg);border-color:#f2b8bd}.panel.good{background:var(--greenbg);border-color:#bce7cd}.narrator{border-left:4px solid var(--purple);background:#f1eeff;border-radius:10px;padding:11px 13px;margin:13px 0;font-size:14px;line-height:1.6}.narrator.bad{border-color:var(--red);background:var(--redbg)}.narrator.good{border-color:var(--green);background:var(--greenbg)}.npc{display:flex;gap:9px;margin:13px 0}.avatar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#ffe2a6;border-radius:12px;flex:none;font-size:20px}.bubble{border:2px solid var(--line);background:#fffaf0;border-radius:14px 14px 14px 3px;padding:10px 12px;font-size:14px;line-height:1.55}.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}.choice{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:13px 14px;text-align:left;box-shadow:var(--shadow);cursor:pointer;font-size:14px}.choice:active,.primary:active{transform:translateY(3px);box-shadow:none}.choice small{display:block;color:var(--soft);font-size:11.5px;margin-top:4px;line-height:1.45}.primary{width:100%;border:none;border-radius:14px;background:var(--purple);color:white;font-weight:700;padding:14px;margin-top:15px;box-shadow:0 6px 0 var(--purple2);cursor:pointer}.primary:disabled{background:#cfc9db;box-shadow:0 6px 0 #b5aec2}.ghost{width:100%;border:2px dashed var(--purple);background:#fff;color:var(--purple);font-weight:700;border-radius:13px;padding:10px;margin-top:9px;cursor:pointer}.moneycard{background:var(--ink);color:#fff;border-radius:16px;padding:15px 17px;margin:13px 0}.moneycard .label{font-size:11px;opacity:.7}.moneycard .amt{font:700 25px 'IBM Plex Mono';margin-top:3px}.moneycard.loss .amt{color:#ff858d}.moneycard.gain .amt{color:#86f4b3}.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 1px;border-bottom:1px dashed var(--line);font-size:13px}.stat b{font-family:'IBM Plex Mono';text-align:right}.tabs{display:flex;gap:6px;margin:12px 0}.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer}.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}.tab.done:after{content:' ✓';color:#7dffae}.checkitem{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}.checkitem:last-child{border-bottom:none}.box{width:20px;height:20px;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}.checkitem.done .box{background:var(--green);border-color:var(--green);color:#fff}.checkitem b{display:block;font-size:13px}.checkitem span{font-size:11.5px;color:var(--soft)}.parallel{background:#17132c;color:#fff;border-radius:18px;padding:20px;margin:12px 0}.parallel h2{font-family:'Gaegu';font-size:24px;color:#c6bbff;margin:4px 0}.parallel p{font-size:13px;line-height:1.7;color:#e4def1}.badend{background:#1b1117;color:#fff;margin:-22px -18px -48px;padding:38px 22px;min-height:calc(100vh - 74px);text-align:center}.badend .skull{font-size:56px}.badend h1{color:#ff6972}.badend p{text-align:left;font-size:13px;line-height:1.7}.retry{width:100%;border:none;border-radius:14px;background:#ff6972;color:#24131a;font-weight:700;padding:14px;margin-top:16px;cursor:pointer}.concept{border:2px solid var(--amber);background:#fff8df;border-radius:14px;padding:12px;margin:12px 0;font-size:12.5px;line-height:1.65}.audit{display:flex;gap:9px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:10px 0;cursor:pointer}.audit:last-child{border-bottom:none}.audit.done .box{background:var(--green);border-color:var(--green);color:white}.clear{text-align:center}.cup{font-size:56px}.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;font:700 10px 'IBM Plex Mono';margin-right:7px}

.eventBreak{min-height:62vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 4px;position:relative}.eventBreak:before{content:'';position:absolute;inset:-22px -18px -48px;z-index:-1;background:radial-gradient(circle at center,#fff 0,#fff 40%,#f5f0e8 100%)}.eventBreak.danger:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#ffe6e8 100%)}.eventBreak.good:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#e7f8ee 100%)}.eventBreak.notice:before{background:radial-gradient(circle at center,#fff 0,#fff 38%,#eeeaff 100%)}.eventTime{display:inline-block;align-self:center;font:700 11px 'IBM Plex Mono';background:#f4efe6;border:1px solid var(--line);border-radius:999px;padding:7px 11px;margin-bottom:17px;color:var(--soft)}.eventIcon{font-size:58px;animation:eventDrop .55s cubic-bezier(.2,.9,.25,1.25)}.eventLabel{font:700 11px 'IBM Plex Mono';letter-spacing:.1em;color:var(--red);margin-top:11px}.eventBreak.good .eventLabel{color:var(--green)}.eventBreak.notice .eventLabel{color:var(--purple)}.eventTitle{font:700 35px 'Gaegu';line-height:1.08;margin:6px 0 10px}.eventAlert{border:2px solid var(--red);background:#fff;border-radius:15px;padding:11px 13px;margin:10px 0;text-align:left;box-shadow:var(--shadow);animation:eventPulse .7s ease}.eventBreak.good .eventAlert{border-color:var(--green)}.eventAlert .source{font:700 10px 'IBM Plex Mono';color:var(--soft);margin-bottom:4px}.eventMsg{background:#fff;border:2px solid var(--line);border-radius:15px;padding:12px 13px;font-size:13.5px;line-height:1.65}.eventQ{font:700 20px 'Gaegu';margin:14px 3px 0;line-height:1.35}.bossbar{height:11px;background:#eee6d8;border-radius:999px;overflow:hidden;margin:11px 0}.bossbar>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--green));transition:width .35s}.lockgrid{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}.lockcard{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.lockcard.on{border-color:var(--green);background:var(--greenbg)}.lockcard .ico{font-size:26px}.lockcard b{display:block;font-size:13px}.lockcard span{font-size:11px;color:var(--soft)}.lockbtn{border:none;background:var(--ink);color:#fff;border-radius:9px;padding:8px 9px;font-size:11px;cursor:pointer}.lockcard.on .lockbtn{background:var(--green)}.phasebar{height:7px;background:#eee6d8;border-radius:999px;overflow:hidden;flex-basis:100%;margin-top:2px}.phasebar>div{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .3s}.processStep{border:2px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;display:flex;gap:9px;align-items:center}.processStep.done{border-color:var(--green);background:var(--greenbg)}.processStep .num{width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px 'IBM Plex Mono';flex:none}.ownerFlip{font:700 24px 'IBM Plex Mono';padding:16px;text-align:center;border:2px solid var(--line);border-radius:15px;background:#fff}.ownerFlip .old{text-decoration:line-through;color:var(--soft)}.ownerFlip .new{color:var(--green);font-size:30px}.scanline{font:700 11px 'IBM Plex Mono';color:var(--purple);letter-spacing:.08em}.scanpulse{animation:scanPulse .75s ease infinite alternate}@keyframes eventDrop{0%{opacity:0;transform:translateY(-35px) scale(.55)}65%{opacity:1;transform:translateY(5px) scale(1.15)}100%{transform:none}}@keyframes eventPulse{0%{opacity:.2;transform:scale(.94)}50%{opacity:1;transform:scale(1.025)}100%{transform:scale(1)}}@keyframes scanPulse{from{opacity:.35}to{opacity:1}}

<script>
'use strict';
const STORE='HOUSE_FILE_GAME1_V7', HIST='HOUSE_FILE_GAME1_V7_H';
const C={startCash:320000000,price:300000000,deposit:30000000,mid:120000000,balance:150000000,address:'서울시 해솔구 독립로 17 / 101동 703호 / 전용 59㎡',wrongAddress:'101동 307호 / 전용 49㎡',owner:'김민수',counterparty:'박현우',mortgageMax:220000000,mortgageActualDebt:180000000,newMortgageMax:120000000,newMortgageBank:'B저축은행'};
const BAD={BE01:{title:'주소 한 칸을 놓쳤습니다',loss:20000000,checkpoint:'contractDraft',story:'계약서에는 101동 307호가 적혀 있었지만 실제로 본 집은 101동 703호였습니다. 목적물을 바로잡지 않은 채 계약해 분쟁이 발생했습니다.'},BE02:{title:'형이라고 다 대리인은 아니었습니다',loss:25000000,checkpoint:'partyBoss',story:'등기부상 소유자는 김민수인데 계약하러 나온 박현우의 대리권을 확인하지 않았습니다. 가족이라는 설명만 믿고 계약금을 지급한 실패세계입니다.'},BE03:{title:'을구를 봤지만 그냥 지나쳤습니다',loss:270000000,checkpoint:'mortgagePlan',story:'선순위 근저당권을 확인하고도 말소조건 없이 거래를 진행했습니다. 이 게임의 경매세계에서는 은행이 먼저 변제받아 큰 손실이 발생합니다.'},BE04:{title:'잔금 버튼부터 눌렀습니다',loss:170000000,checkpoint:'balanceApproach',story:'중도금 지급 뒤 새 근저당권이 설정됐지만 잔금 직전 최신 등기부와 권리변동을 확인하지 않고 송금을 진행한 실패세계입니다.'},BE05:{title:'돈은 냈는데 집은 남의 것',loss:260000000,checkpoint:'registerChoice',story:'잔금까지 지급하고도 소유권이전등기를 미루는 사이 제3자가 먼저 등기를 마친 실패세계입니다.'}};
const DEF={scene:'title',checkpoint:'title',cash:C.startCash,selectedListing:null,concepts:[],badEnds:[],lossLedger:{},reincarnations:0,activeBad:null,paid:{deposit:false,mid:false,balance:false},regTab:'title',regTicks:{},plan:false,authority:false,actualDebtChecked:false,contractFixed:false,newMortgageFound:false,registered:false,balanceLocks:{registry:false,mortgage:false,transfer:false,delivery:false},clearanceStep:0,transferDocs:{identity:false,application:false,simultaneous:false},registerStep:0,auditScanning:null,audit:{title:false,owner:false,mortgage:false}};
let S=load(),H=loadH();
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return clone(DEF)}}function loadH(){try{return JSON.parse(localStorage.getItem(HIST)||'[]')}catch(e){return[]}}function save(){localStorage.setItem(STORE,JSON.stringify(S));localStorage.setItem(HIST,JSON.stringify(H))}function money(n){return '₩'+Math.round(n||0).toLocaleString('ko-KR')}function unlock(x){if(!S.concepts.includes(x))S.concepts.push(x)}function snap(){H.push(clone(S));if(H.length>35)H.shift()}function go(id,mut=null,opt={}){if(!opt.skip)snap();if(mut)mut();S.scene=id;save();render();window.scrollTo(0,0)}function back(){if(!H.length)return;S=H.pop();save();render();window.scrollTo(0,0)}function setCP(x){S.checkpoint=x}function reset(){if(confirm('GAME 1 진행 상황을 초기화할까요?')){localStorage.removeItem(STORE);localStorage.removeItem(HIST);S=clone(DEF);H=[];render()}}function recordBad(code){if(!S.badEnds.includes(code)){S.badEnds.push(code);S.lossLedger[code]=BAD[code].loss}}function bad(code){recordBad(code);S.activeBad=code;S.checkpoint=BAD[code].checkpoint;save();fx('bad');setTimeout(()=>go('badend',null,{skip:true}),240)}function reincarnate(){S.reincarnations++;S.scene=S.checkpoint;S.activeBad=null;H=[];save();render()}
function fx(type){const a=document.querySelector('#app');a.classList.remove('screenShake','screenZoom','flashRed','flashGreen');void a.offsetWidth;if(type==='bad')a.classList.add('screenShake','flashRed');if(type==='good')a.classList.add('screenZoom','flashGreen');}
function moneyFx(n){const d=document.createElement('div');d.className='moneyFloat';d.style.left='50%';d.style.top='40%';d.textContent='-'+money(n);document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
function popup(icon,title,body,cb,label='계속'){const scr=document.createElement('div');scr.className='scrim';const p=document.createElement('div');p.className='popup';p.innerHTML=`<div class="icon">${icon}</div><h2>${title}</h2><div class="body" style="font-size:13px">${body}</div><button>${label}</button>`;document.body.append(scr,p);p.querySelector('button').onclick=()=>{scr.remove();p.remove();if(cb)cb()}}
function concept(name,desc,cb){unlock(name);save();const b=document.createElement('div');b.className='lockBurst';b.textContent='🔓';document.body.appendChild(b);setTimeout(()=>b.remove(),850);popup('📚','CONCEPT UNLOCKED',`<b>${name}</b><br>${desc}`,cb)}
function confetti(){for(let i=0;i<34;i++){const d=document.createElement('div');d.className='confettiPiece';d.style.left=Math.random()*100+'vw';d.style.background=['#6d5ce8','#ffb21a','#17995a','#ef4852'][i%4];d.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}}
function phaseInfo(){let n=0,label='준비';if(/^train/.test(S.scene))label='Training';if(['listing','pressureEvent','tempt','parallelFirst'].includes(S.scene))n=1,label='Stage 1 · 매물 선택';if(['registry','partyBoss'].includes(S.scene))n=2,label='Stage 2 · 등기부 수사';if(['mortgageMeaning','mortgageDebtCheck','mortgagePlan'].includes(S.scene))n=2.2,label='Stage 2-1 · 근저당 확인';if(['contractDraft','contractEffect'].includes(S.scene))n=3,label='Stage 3 · 매매 계약';if(['depositPay','cancelLab'].includes(S.scene))n=4,label='Stage 4 · 계약금 지급';if(['midPay','performanceEvent','afterMid'].includes(S.scene))n=5,label='Stage 5 · 중도금 후 해제';if(['balanceApproach','balanceGate','newMortgageEvent','newMortgageDetail'].includes(S.scene))n=6,label='Stage 6 · 잔금 전';if(['balanceBoss','clearanceProcess','transferDocs','deliveryCheck'].includes(S.scene))n=7,label='Stage 7 · 잔금 Day';if(['paymentCompleteEvent','ownershipShockEvent','ownershipQ','registerChoice','registerProcess','ownerChangeEvent'].includes(S.scene))n=8,label='Stage 8 · 소유권이전등기';if(['audit','bonusAudit','clear'].includes(S.scene))n=9,label='Final · 등기 결과 재확인';return {n,label,pct:Math.min(100,n/9*100)}}
function worksheetStage(scene){const groups=[
  {scenes:['train1','train2','train3','train4','train5'],no:'Training',title:'재산권·물권 기초',page:'학습지 p.1'},

SC.mortgageMeaning=el=>{el.innerHTML=head('STAGE 2-1','근저당 확인','을구에서 A은행 근저당권과 채권최고액을 발견했습니다.')+`<div class="panel bad"><div class="stat"><span>근저당권자</span><b>A은행</b></div><div class="stat"><span>채권최고액</span><b>${money(C.mortgageMax)}</b></div></div><div class="narrator">채권최고액 ${money(C.mortgageMax)} = 지금 집주인이 은행에 실제로 남겨 둔 빚 ${money(C.mortgageMax)}이라는 뜻일까?</div><div class="choices"><button class="choice" data-v="o">O — 실제 남은 빚과 항상 같다</button><button class="choice" data-v="x">X — 담보되는 채권의 최고 한도이므로 실제 채무액은 별도 확인해야 한다</button></div>${sheetCue('Stage 2-1의 “채권최고액 = 실제 남은 빚이다? O / X”에 먼저 표시하세요.')}`;choiceBind(el,v=>v==='x'?concept('근저당권·채권최고액','근저당권은 계속적인 거래관계에서 생기는 다수의 특정되지 않은 채권을 <b>채권최고액의 범위</b>에서 담보하는 저당권입니다. 따라서 채권최고액을 실제 남은 대출잔액과 같다고 단정하면 안 됩니다.',()=>go('mortgageDebtCheck',()=>setCP('mortgageDebtCheck'))):retry(el,'❌ 채권최고액은 담보 한도입니다. 실제 남은 채무액은 별도로 확인해야 합니다.','mortgageMeaning'))};
SC.mortgageDebtCheck=el=>{el.innerHTML=head('STAGE 2-1 · CHECK','채권최고액 말고 실제 채무도 확인하자','학습지의 “실제 담보채무 별도 확인”을 게임에서 직접 수행합니다.')+`<div class="panel"><div class="stat"><span>등기부에서 확인한 채권최고액</span><b>${money(C.mortgageMax)}</b></div><div class="stat"><span>현재 실제 담보채무 잔액</span><b>${S.actualDebtChecked?money(C.mortgageActualDebt):'???'}</b></div></div>${!S.actualDebtChecked?`<div class="choices"><button class="choice" data-v="assume">채권최고액이 2억2천이니 실제 빚도 2억2천으로 보고 진행</button><button class="choice" data-v="check">은행 상환 예정액·채무잔액 자료를 별도로 확인한다</button></div>`:`<div class="narrator good"><b>✅ 학습용 사건의 실제 담보채무 잔액: ${money(C.mortgageActualDebt)}</b><br>채권최고액 ${money(C.mortgageMax)}과 실제 채무액이 다르다는 것을 확인했습니다.</div>${sheetCue('Stage 2-1의 “실제 담보채무 별도 확인” 칸을 체크하세요.')}<button class="primary" id="next">이제 이 근저당을 거래에서 어떻게 처리할지 결정</button>`}`;if(!S.actualDebtChecked){choiceBind(el,v=>{if(v==='check'){S.actualDebtChecked=true;save();fx('good');render()}else retry(el,'❌ 채권최고액만으로 실제 채무잔액을 확정하지 않습니다. 실제 상환 예정액·채무 자료를 별도로 확인해야 합니다.','mortgageDebtCheck')})}else{el.querySelector('#next').onclick=()=>go('mortgagePlan',()=>setCP('mortgagePlan'))}};
SC.mortgagePlan=el=>{el.innerHTML=head('STAGE 2-1 · BOSS','근저당을 확인했으면 이제 무엇을 할까?','등기부를 “봤다”에서 끝내지 않고 거래조건을 바꿔야 합니다.')+`<div class="panel bad"><div class="stat"><span>A은행 근저당권 채권최고액</span><b>${money(C.mortgageMax)}</b></div></div><div class="choices"><button class="choice" data-v="ignore">확인했으니 됐다. 그냥 진행</button><button class="choice" data-v="plan">잔금일에 담보채무 상환과 근저당 말소 절차가 함께 진행되도록 조건을 설계한다</button></div>`;choiceBind(el,v=>v==='plan'?concept('선순위 담보권 말소조건','을구에 남아 있는 담보권은 잔금 지급 전후의 거래구조에서 실제로 정리되도록 설계해야 합니다. “확인”과 “말소”는 다른 단계입니다.',()=>go('contractDraft',()=>{S.plan=true;setCP('contractDraft')})):bad('BE03'))};
SC.contractDraft=el=>{el.innerHTML=head('STAGE 3','매매계약서 최종 확인','부동산 매매계약은 매도인이 소유권을 이전하고 매수인이 대금을 지급하기로 하는 계약입니다.')+`<div class="panel"><div class="stat"><span>매매대금</span><b>${money(C.price)}</b></div><div class="stat"><span>계약금 10%</span><b>${money(C.deposit)}</b></div><div class="stat"><span>중도금 40%</span><b>${money(C.mid)}</b></div><div class="stat"><span>잔금 50%</span><b>${money(C.balance)}</b></div><div class="stat"><span>목적 부동산</span><b style="color:var(--red)">${C.wrongAddress}</b></div><div class="stat"><span>담보권 처리 조건</span><b>잔금일 말소 절차 연계</b></div></div><div class="choices"><button class="choice" data-v="sign">금액 맞으니 서명</button><button class="choice" data-v="fix">동·호수 오류를 고치고 실제 목적물과 다시 대조</button></div>${sheetCue('Stage 3의 게임 속 조건(계약금 10%·중도금 40%·잔금 50%)을 확인하세요.')}`;choiceBind(el,v=>v==='fix'?concept('목적물 특정','계약서의 주소·동·호수·면적을 실제로 본 부동산과 대조합니다.',()=>go('contractEffect',()=>{S.contractFixed=true})):bad('BE01'))};
SC.contractEffect=el=>{el.innerHTML=head('STAGE 3','계약 체결 직후, 나는 이미 소유자일까?')+`<div class="choices"><button class="choice" data-v="yes">O — 매매계약을 체결했으니 이미 내 집이다</button><button class="choice" data-v="no">X — 매도인의 소유권이전 의무와 매수인의 대금지급 의무가 생겼을 뿐, 아직 소유권 취득 전이다</button></div>${sheetCue('학습지 Stage 3의 “계약 체결 직후 나는 이미 소유자다? O / X”에 표시하고 이유를 적으세요.')}`;choiceBind(el,v=>v==='no'?concept('매매계약의 채권적 효력','매매계약이 체결되면 매도인은 <b>소유권을 이전할 의무</b>, 매수인은 <b>대금을 지급할 의무</b>를 부담합니다. 부동산 소유권 자체의 취득은 뒤의 등기 단계와 구별해야 합니다.',()=>go('depositPay',()=>setCP('depositPay'))):retry(el,'❌ 매매계약 체결과 부동산 소유권 취득 시점을 구별하세요.','contractEffect'))};
SC.depositPay=el=>{const after=S.paid.deposit?S.cash:S.cash-C.deposit;el.innerHTML=head('STAGE 4','계약금 지급','전 재산 3억 2천 중 첫 3천만 원이 실제로 움직입니다.')+`<div class="moneycard"><div class="label">지급 후 남은 전 재산</div><div class="amt">${money(after)}</div></div><button class="primary" id="pay">${S.paid.deposit?'지급 완료 — 해약금 실험으로':'계약금 ${money(C.deposit)} 지급'}</button>`;el.querySelector('#pay').onclick=()=>{if(!S.paid.deposit){S.cash-=C.deposit;S.paid.deposit=true;save();moneyFx(C.deposit);fx('good');setTimeout(()=>go('cancelLab',()=>setCP('cancelLab')),500)}else go('cancelLab')}};
SC.cancelLab=el=>{el.innerHTML=head('STAGE 4 · PARALLEL LAB','계약금을 줬는데 마음이 바뀌었다면?','본편 계약은 유지한 채 해약금 규정을 실험합니다.')+npc('👩','더 싼 집이 나왔어요. 계약금을 돌려받고 그냥 취소하면 안 되나요?')+`<div class="parallel"><p>아직 어느 당사자도 이행에 착수하지 않았고, 별도 약정은 없다고 가정합니다.</p></div><div class="choices"><button class="choice" data-v="refund">매수인은 계약금을 전액 돌려받고 일방 해제</button><button class="choice" data-v="give">매수인은 계약금을 포기하고 해제 / 매도인은 계약금 배액을 상환하고 해제</button><button class="choice" data-v="never">계약은 절대 해제할 수 없다</button></div>${sheetCue('Stage 4 빈칸: “당사자 일방이 (이행에 착수)하기 전까지 / 매수인은 계약금 포기 / 매도인은 배액 상환”으로 정리됩니다.')}`;choiceBind(el,v=>v==='give'?concept('해약금 · 민법 제565조','다른 약정이 없다면 <b>당사자 일방이 이행에 착수하기 전까지</b> 교부자는 계약금을 포기하고, 수령자는 그 배액을 상환하여 매매계약을 해제할 수 있습니다.',()=>go('midPay')):retry(el,'❌ 기준은 “계약금을 줬는가” 자체가 아니라 이행 착수 전인지입니다.','cancelLab'))};
SC.midPay=el=>{const after=S.paid.mid?S.cash:S.cash-C.mid;el.innerHTML=head('STAGE 5','중도금 지급','중도금 지급은 이행 착수의 대표적인 사례입니다.')+`<div class="panel warn"><b>⚠ POINT OF NO RETURN</b><p class="tiny">이 학습 사건에서는 중도금 지급으로 이행에 착수한 것으로 설정합니다.</p></div><div class="moneycard"><div class="label">지급 후 남은 전 재산</div><div class="amt">${money(after)}</div></div><button class="primary" id="pay">${S.paid.mid?'지급 완료 — 계약 해제 판단':'중도금 ${money(C.mid)} 지급'}</button>`;el.querySelector('#pay').onclick=()=>{if(!S.paid.mid){S.cash-=C.mid;S.paid.mid=true;save();moneyFx(C.mid);fx('good');setTimeout(()=>go('performanceEvent',()=>setCP('afterMid')),500)}else go('performanceEvent')}};

SC.ownerChangeEvent=el=>{eventBreak(el,{mode:'good',icon:'🏡',label:'OWNERSHIP ACQUIRED',title:'갑구의 이름이 바뀌었다',alert:`<div class="source">재발급 등기부 · 갑구</div><div class="ownerFlip"><span class="old">${C.owner}</span><br>↓<br><span class="new">PLAYER</span></div>`,message:'이제 비로소 법률행위로 인한 소유권이전이 등기에 반영되었습니다.',question:'“돈만 낸 게 아니라 소유권까지 확보했다.”',button:'FINAL SECURITY SCAN',next:'audit'})};
SC.audit=el=>{const a=S.audit,all=a.title&&a.owner&&a.mortgage;el.innerHTML=head('FINAL','등기 완료 후 결과 재확인','“신청했다”에서 끝내지 말고 재발급 등기부로 결과를 확인합니다.')+`<div class="panel"><div class="audit ${a.title?'done':''}" data-k="title"><div class="box">${a.title?'✓':''}</div><div><b>표제부 · 내가 산 부동산이 맞나?</b><div class="tiny">${S.auditScanning==='title'?'<span class="scanline scanpulse">SCANNING...</span>':'주소·동·호수·면적 재확인'}</div></div></div><div class="audit ${a.owner?'done':''}" data-k="owner"><div class="box">${a.owner?'✓':''}</div><div><b>갑구 · 현재 소유자가 누구인가?</b><div class="tiny">${S.auditScanning==='owner'?'<span class="scanline scanpulse">SCANNING...</span>':'현재 소유자: PLAYER'}</div></div></div><div class="audit ${a.mortgage?'done':''}" data-k="mortgage"><div class="box">${a.mortgage?'✓':''}</div><div><b>을구 · 말소하기로 한 근저당이 사라졌나?</b><div class="tiny">${S.auditScanning==='mortgage'?'<span class="scanline scanpulse">SCANNING...</span>':'기존·신규 근저당 말소 결과 확인'}</div></div></div></div>${all?sheetCue('Final의 표제부·갑구·을구 재확인 칸을 체크하고 “신청만으로 끝내지 않고 결과를 확인해야 하는 이유”를 적으세요.'):''}<button class="primary" id="done" ${all?'':'disabled'}>${all?'🔐 PROPERTY SECURED':'세 영역을 모두 스캔하세요'}</button><div class="tiny">※ 등기부는 핵심 자료지만 실제 권리관계·대리권·채무·말소 결과 등도 함께 확인해야 합니다.</div>`;el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(a[k]||S.auditScanning)return;S.auditScanning=k;save();render();setTimeout(()=>{S.audit[k]=true;S.auditScanning=null;save();fx('good');render()},650)});const d=el.querySelector('#done');if(d)d.onclick=()=>go('bonusAudit')};
SC.bonusAudit=el=>{el.innerHTML=head('FINAL · BONUS','등기부만 보면 100% 안전?','학습지 “등기부의 한계”를 마지막으로 확인합니다.')+`<div class="choices"><button class="choice" data-v="yes">O — 등기부 기재만 믿으면 실제 권리관계와 달라도 언제나 보호된다</button><button class="choice" data-v="no">X — 등기부 확인은 필수지만 실제 권리관계가 다르면 보호받지 못할 수 있어 추가 확인이 필요하다</button></div>`;choiceBind(el,v=>v==='no'?concept('등기부의 한계 · 공신력 일반적 부정','등기 사항 전부 증명서를 확인하는 것은 필수이지만, 기재 내용과 실제 권리관계가 다를 가능성까지 완전히 제거하는 것은 아닙니다. 따라서 거래 상대방·대리권·채무·말소 결과 등 실제 권리관계도 함께 확인해야 합니다.',()=>go('clear')):retry(el,'❌ 등기부는 핵심 자료지만 “기재되어 있으면 무조건 100% 진실이고 보호된다”는 의미는 아닙니다.','bonusAudit'))};
SC.clear=el=>{confetti();const loss=Object.values(S.lossLedger).reduce((a,b)=>a+b,0);el.innerHTML=`<div class="clear"><div class="cup">🏆</div><div class="eyebrow">CASE 01 CLOSED</div><h1>PROPERTY SECURED</h1><p class="sub">3억을 지급한 것에서 끝나지 않고, 등기부 갑구의 소유자를 PLAYER로 바꿨습니다.</p></div><div class="panel dark"><div class="stat"><span>현금</span><b>${money(S.cash)}</b></div><div class="stat"><span>소유권</span><b>PLAYER ✅</b></div><div class="stat"><span>최종 권리상태</span><b>SECURED</b></div></div><div class="stat"><span>취득한 부동산</span><b>${money(C.price)}</b></div><div class="tiny">※ 남은 현금은 학습용 단순 계산값이며 취득세·중개보수 등 부대비용은 제외했습니다.</div><div class="stat"><span>발견한 BAD END</span><b>${S.badEnds.length}</b></div><div class="stat"><span>환생 횟수</span><b>${S.reincarnations}</b></div><div class="stat"><span>실패세계 손실 합계</span><b>${money(loss)}</b></div><div class="concept"><b>📚 법률도감</b><br>${S.concepts.join(' · ')}</div><div class="narrator good"><b>MISSION COMPLETE</b><br>계약 전에는 권리를 조사하고, 잔금 전에는 변동을 재확인하고, 마지막에는 등기로 소유권을 확보했습니다.</div><button class="primary" id="again">처음부터 다시 플레이</button>`;el.querySelector('#again').onclick=reset};
SC.badend=el=>{const b=BAD[S.activeBad];el.innerHTML=`<div class="badend"><div class="skull">☠️</div><div class="eyebrow" style="color:#ff9ca3">BAD END · ${S.activeBad}</div><h1>「${b.title}」</h1><div class="moneycard loss" style="text-align:left"><div class="label">실패세계 게임상 손실</div><div class="amt">- ${money(b.loss)}</div></div><p>${b.story}</p><div class="tiny" style="color:#cbbdc5">손실액은 수업용 사건 설정값입니다.</div><button class="retry" id="r">♻ 체크포인트로 환생</button></div>`;el.querySelector('#r').onclick=reincarnate};
function render(){hud();const el=document.querySelector('#stage');(SC[S.scene]||SC.title)(el);const w=worksheetStage(S.scene);if(w&&S.scene!=='badend'){el.insertAdjacentHTML('afterbegin',stageBand(w))}}render();
</script>
</body>
</html>
