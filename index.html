<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOUSE FILE v1.5 — 독립 생존 법률 시뮬레이터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

:root{
  --cream:#FFF7EA;
  --paper:#FFFFFF;
  --ink:#241F2B;
  --ink-soft:#5B5566;
  --money:#1E9E5A;
  --money-dark:#127A43;
  --danger:#FF4B4B;
  --danger-dark:#C2222B;
  --warn:#FFB100;
  --accent:#6E5DF2;
  --accent-soft:#EFEBFF;
  --line:#E9E1D2;
  --radius:18px;
  --shadow: 0 6px 0 rgba(36,31,43,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  background-image:
    radial-gradient(circle at 10% 10%, #FFF1DA 0, transparent 45%),
    radial-gradient(circle at 90% 85%, #F1ECFF 0, transparent 40%);
  color:var(--ink);
  font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#root{
  width:100%;
  max-width:520px;
  min-height:100vh;
  background:var(--paper);
  box-shadow:0 0 60px rgba(36,31,43,0.08);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.brand-font{font-family:'Jua','Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; font-weight:400;}
.mono{font-family:'Consolas','D2Coding','Courier New',monospace;}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:40;
  background:var(--ink);
  color:#fff;
  padding:10px 16px 12px;
  border-bottom:4px solid var(--warn);
}
#hud .row1{display:flex; justify-content:space-between; align-items:baseline;}
#hud .stagechip{
  font-size:11px; letter-spacing:.02em; color:#ffe9b0; opacity:.85;
}
#hud .cash{
  font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; font-weight:700; font-size:19px; font-variant-numeric:tabular-nums;
  color:#7CFFB2;
}
#hud .row2{
  display:flex; gap:10px; margin-top:6px; font-size:11px; opacity:.85;
}
#hud .pill{
  background:rgba(255,255,255,.08); border-radius:999px; padding:3px 9px;
  display:flex; gap:4px; align-items:center;
}

#hud .row1{display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center;}
#hud .stagechip{justify-self:start;}
#hud .cash{justify-self:end;}
.hud-back{
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.10);
  color:#fff;
  border-radius:10px;
  padding:6px 9px;
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}
.hud-back:disabled{opacity:.28; cursor:default;}

/* ---------- scene wrapper ---------- */
#stage{
  flex:1; padding:22px 20px 40px;
  animation: fadeIn .35s ease;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

h1.scene-title{
  font-family:'Jua','Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; font-weight:400; font-size:26px; margin:0 0 4px;
  line-height:1.25;
}
p.scene-sub{ color:var(--ink-soft); font-size:14px; margin:0 0 18px;}
p.body-text{ font-size:15.5px; line-height:1.75; margin:0 0 14px; }
.narrator{
  background:var(--accent-soft); border-left:4px solid var(--accent);
  padding:12px 14px; border-radius:10px; font-size:14px; margin:14px 0;
}
.npc{
  display:flex; gap:10px; align-items:flex-start; margin:14px 0;
}
.npc .avatar{
  width:38px; height:38px; border-radius:12px; background:var(--warn);
  display:flex; align-items:center; justify-content:center; font-size:18px;
  flex-shrink:0;
}
.npc .bubble{
  background:#FAF6EC; border:2px solid var(--line); border-radius:14px 14px 14px 2px;
  padding:10px 13px; font-size:14.5px; line-height:1.6;
}

/* ---------- choices ---------- */
.choices{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
button.choice{
  text-align:left; border:2px solid var(--ink); background:var(--paper);
  font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  border-radius:14px; padding:13px 15px; font-size:15px; cursor:pointer;
  box-shadow: var(--shadow); transition:transform .08s ease;
  font-family:inherit; color:var(--ink);
}
button.choice:active{ transform:translateY(3px); box-shadow:none; }
button.choice .tag{
  display:inline-block; font-family:'Consolas','D2Coding','Courier New',monospace; font-size:11px;
  background:var(--ink); color:#fff; border-radius:6px; padding:1px 6px; margin-right:8px;
}
button.primary{
  border:none; background:var(--accent); color:#fff; border-radius:14px;
  font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  padding:14px 16px; font-size:15.5px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 0 #4A3BC4; width:100%; margin-top:16px; font-family:inherit;
}
button.primary:disabled{ background:#CFC9DA; box-shadow:0 6px 0 #B4ADC4; cursor:not-allowed; }
button.primary:active:not(:disabled){ transform:translateY(3px); box-shadow:none; }
button.ghost{
  border:2px dashed var(--accent); background:#fff; color:var(--accent);
  border-radius:14px; padding:10px 14px; font-size:13.5px; cursor:pointer;
  width:100%; margin-top:10px; font-family:inherit; font-weight:700;
}

/* ---------- money card ---------- */
.moneycard{
  background:var(--ink); color:#fff; border-radius:16px; padding:16px 18px; margin:16px 0;
}
.moneycard .label{ font-size:12px; opacity:.7; }
.moneycard .amount{ font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.moneycard.loss{ background:linear-gradient(135deg,#3A1418,#2A0F13); }
.moneycard.loss .amount{
  color:#FF8E98;
  font-family:'Jua','Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  font-weight:400;
  letter-spacing:-.02em;
}
.moneycard.gain .amount{ color:#7CFFB2; }

/* ---------- registry (등기부) ---------- */
.tabs{ display:flex; gap:6px; margin:14px 0 10px; }
.tab{
  flex:1; text-align:center; padding:10px 4px; border-radius:10px; border:2px solid var(--line);
  font-size:13px; cursor:pointer; background:#fff; font-weight:700;
}
.tab.active{ border-color:var(--ink); background:var(--ink); color:#fff; }
.tab.done::after{ content:' ✅'; }
.panel{
  border:2px solid var(--line); border-radius:14px; padding:14px; font-size:14px;
}
.check-item{
  display:flex; gap:10px; align-items:flex-start; padding:9px 4px; border-bottom:1px dashed var(--line);
  cursor:pointer;
}
.check-item:last-child{border-bottom:none;}
.check-item .box{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--ink); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.check-item.checked .box{ background:var(--money); border-color:var(--money-dark); color:#fff; }
.check-item .txt b{display:block; font-size:13.5px;}
.check-item .txt span{font-size:12px; color:var(--ink-soft);}

/* ---------- bad end ---------- */
.badend-screen{
  background:#1B1420; color:#fff; margin:-22px -20px -40px; padding:40px 24px 34px;
  min-height:100vh; text-align:center;
}
.badend-screen .skull{ font-size:44px; }
.badend-screen h2{ font-family:'Jua','Gowun Dodum',sans-serif; color:#FF6363; font-size:24px; margin:6px 0 2px;}
.badend-screen h3{ font-size:16px; color:#fff; opacity:.9; margin:0 0 20px; font-weight:400;}
.reincarnate{
  margin-top:22px; background:#FF6363; border:none; color:#1B1420; font-weight:700;
  padding:14px 20px; border-radius:14px; font-size:15px; width:100%; font-family:inherit; cursor:pointer;
}

/* ---------- parallel world ---------- */
.parallel-screen{
  background:#12102A; color:#fff; margin:-22px -20px -40px; padding:40px 24px 34px; min-height:100vh; text-align:center;
}
.parallel-screen h2{font-family:'Jua','Gowun Dodum',sans-serif; color:#B7A9FF; font-size:22px;}


/* ---------- good decision popup ---------- */
.decision-overlay{
  position:fixed; inset:0; z-index:120;
  background:rgba(20,16,28,.64);
  display:flex; align-items:center; justify-content:center;
  padding:18px;
  animation:fadeIn .18s ease;
}
.decision-card{
  width:min(480px,100%);
  max-height:88vh; overflow:auto;
  background:#fff; color:var(--ink);
  border-radius:22px; padding:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);
  border:2px solid #DCD5FF;
}
.decision-card h2{
  margin:0 0 6px; font-family:'Jua','Gowun Dodum',sans-serif; font-weight:400; font-size:27px;
  color:var(--money-dark);
}
.decision-card .effect-box{
  margin-top:14px; padding:14px;
  background:#EFFAF4; border:2px solid #A9DFC4;
  border-radius:14px; line-height:1.65; font-size:14px;
}
.decision-card .effect-box .label{
  display:block; font-size:11px; font-weight:800;
  color:var(--money-dark); letter-spacing:.04em; margin-bottom:3px;
}
.decision-card .whatif{
  margin-top:16px; padding:15px;
  background:#FFF1F2; border:2px solid #F2B4BA;
  border-radius:14px;
}
.decision-card .whatif h3{
  margin:0 0 9px; font-size:17px; color:var(--danger-dark);
}
.decision-card .whatif .lossline{
  display:inline-block;
  font-family:'Jua','Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  font-weight:400;
  font-size:24px;
  line-height:1.25;
  color:#B92332;
  letter-spacing:-.02em;
  background:#FFE3E6;
  border-radius:12px;
  padding:7px 11px;
  margin:5px 0 10px;
}
.decision-card .whatif p{
  margin:0; font-size:13.5px; line-height:1.7; color:#4A3F46;
}
.decision-card .decision-note{
  margin-top:9px; font-size:11px; line-height:1.55; color:var(--ink-soft);
}

/* ---------- clear ---------- */
.clear-screen{ text-align:center; }
.trophy{ font-size:48px; }
.stat-row{
  display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px dashed var(--line); font-size:14px;
}
.stat-row b{font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; font-variant-numeric:tabular-nums;}

/* ---------- misc ---------- */
.small-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }
.concept-unlock{
  background:#FFF6DA; border:2px solid var(--warn); border-radius:14px; padding:12px 14px; margin:16px 0; text-align:center;
}
.concept-unlock .lock{ font-size:12px; color:#9A7300; }
.concept-unlock .name{ font-family:'Jua','Gowun Dodum',sans-serif; font-size:20px; margin-top:2px; }
#restartFab{
  position:fixed; bottom:16px; right:calc(50% - 250px + 16px); z-index:50;
  background:var(--ink); color:#fff; border:none; border-radius:999px; width:42px; height:42px;
  font-size:16px; cursor:pointer; opacity:.35;
}
@media (max-width:560px){ #restartFab{ right:16px; } }
</style>
</head>
<body>
<div id="root">
  <div id="hud"></div>
  <div id="stage"></div>
</div>
<button id="restartFab" title="교사용 초기화">↺</button>

<script>
/* =========================================================================
   HOUSE FILE — 독립 생존 법률 시뮬레이터
   엔진과 사건(SCENES) 데이터를 분리한 구조.
   - LEGAL_CONFIG : 법령 수치처럼 개정될 수 있는 값 (담당 교사가 값만 교체 가능)
   - CASES        : 사건별 고정 수치(매물가, 손실액 등)
   - STATE        : 진행 상태, localStorage에 저장
   ========================================================================= */

const LEGAL_CONFIG = {
  // 10%·40%·50%는 이 게임의 계약조건이며 법정비율이 아니다.
  deposit: { downPaymentRatio: 0.10, midPaymentRatio: 0.40, balanceRatio: 0.50 }
};

const CASES = {
  g1: {
    playerCash: 320000000,
    price: 300000000,
    address: "서울시 해솔구 독립로 17, HOUSE 101동 703호 / 전용 59㎡",
    wrongAddress: "101동 307호 / 전용 49㎡",
    ownerListed: "김민수",
    counterparty: "박현우 (본인 주장: 김민수의 동생)",
    // 등기부에 보이는 채권최고액과 실제 피담보채무액은 다를 수 있다.
    mortgageMaximum: 220000000,
    mortgageDebt: 180000000,
    newMortgageMaximum: 120000000,
    newMortgageDebt: 100000000,
    auctionExisting: { salePrice:260000000, priorityCosts:10000000 },
    auctionNew: { salePrice:250000000, priorityCosts:10000000 }
  }
};

const LISTINGS = {
  a:{
    name:'A · 역세권 구축',
    price:300000000,
    detail:'지하철 도보 5분 · 25년 차 아파트 · 12층 남향 · 2년 전 내부 리모델링 · 출퇴근은 편하지만 주차가 다소 혼잡함',
    emoji:'🚇'
  },
  b:{
    name:'B · 균형형 매물',
    price:300000000,
    detail:'지하철 도보 8분 · 15년 차 아파트 · 8층 남동향 · 수리 상태 양호 · 단지 관리와 주차가 무난함',
    emoji:'🏢'
  },
  c:{
    name:'C · 신축급 급매',
    price:300000000,
    detail:'지하철 도보 12분 · 8년 차 아파트 · 3층 · 내부 상태 신축급 · 조용하지만 상권이 조금 멂 · 매도인이 “오늘 계약”을 재촉함',
    emoji:'✨'
  }
};

const money = n => '₩' + Math.round(n).toLocaleString('ko-KR');
const moneyShort = n => {
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  return sign + '₩' + n.toLocaleString('ko-KR');
};

/* ---------------------------- STATE ---------------------------- */
const DEFAULT_STATE = {
  scene: 'title',
  cash: CASES.g1.playerCash,
  purchasePaid: 0,       // 매매대금으로 이미 지급했지만 아직 부동산으로 전환되지 않은 가치
  propertyValue: 0,      // 소유권이전등기 완료 후 보유 부동산 가치
  debt: 0,
  actualLoss: 0,
  avoidedLoss: 0,
  multiverseLoss: 0,
  badEnds: [],
  seenParallel: [],
  concepts: [],
  reincarnations: 0,
  payments: { deposit:false, interim:false, balance:false },
  selectedListing: null,
  checkpoints: {},
  registryChecks: { title:false, owner:false, mortgage:false, recheck:false, finalTitle:false, finalOwner:false, finalMortgage:false },
  registryTicks: {}
};

let BACK_STACK = loadBackStack();

function loadBackStack(){
  try{
    const raw = localStorage.getItem('housefile_v1_5_back');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveBackStack(){
  try{
    localStorage.setItem('housefile_v1_5_back', JSON.stringify(BACK_STACK.slice(-80)));
  }catch(e){}
}
function navSnapshot(){
  return structuredClone(STATE);
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('housefile_v1_5');
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign(structuredClone(DEFAULT_STATE), parsed);
    }
  }catch(e){}
  return structuredClone(DEFAULT_STATE);
}
function saveState(){
  localStorage.setItem('housefile_v1_5', JSON.stringify(STATE));
}
function resetAll(){
  if(!confirm('진행 상황을 모두 초기화할까요? (교사용 초기화)')) return;
  localStorage.removeItem('housefile_v1_5');
  localStorage.removeItem('housefile_v1_5_back');
  BACK_STACK = [];
  STATE = structuredClone(DEFAULT_STATE);
  render();
}
document.getElementById('restartFab').onclick = resetAll;

function netWorth(){
  return STATE.cash + STATE.purchasePaid + STATE.propertyValue - STATE.debt;
}
function unlockConcept(name){
  if(!STATE.concepts.includes(name)) STATE.concepts.push(name);
}
function addBadEnd(code){
  if(!STATE.badEnds.includes(code)) STATE.badEnds.push(code);
}
function addParallel(code, avoided){
  if(!STATE.seenParallel.includes(code)){
    STATE.seenParallel.push(code);
    STATE.avoidedLoss += avoided;
    STATE.multiverseLoss += avoided;
  }
}
function addSimulation(code, loss){
  if(!STATE.seenParallel.includes(code)){
    STATE.seenParallel.push(code);
    STATE.multiverseLoss += loss;
  }
}
function goTo(id, recordHistory=true){
  if(recordHistory && id !== STATE.scene){
    BACK_STACK.push(navSnapshot());
    if(BACK_STACK.length > 80) BACK_STACK.shift();
    saveBackStack();
  }
  STATE.scene = id;
  saveState();
  render();
  window.scrollTo(0,0);
}
function goBack(){
  if(!BACK_STACK.length) return;
  const prev = BACK_STACK.pop();
  saveBackStack();
  STATE = structuredClone(prev);
  saveState();
  render();
  window.scrollTo(0,0);
}
function returnToTitle(){
  goTo('title');
}
function restartFromBeginning(){
  if(!confirm('지금까지의 진행을 지우고 처음부터 다시 플레이할까요?')) return;
  localStorage.removeItem('housefile_v1_5');
  localStorage.removeItem('housefile_v1_5_back');
  BACK_STACK = [];
  STATE = structuredClone(DEFAULT_STATE);
  saveState();
  render();
  window.scrollTo(0,0);
}

function applyPurchasePayment(kind, amount){
  if(STATE.payments[kind]) return;
  STATE.payments[kind] = true;
  STATE.cash -= amount;
  STATE.purchasePaid += amount;
  saveState();
}
function completeRegistration(){
  if(STATE.propertyValue > 0) return;
  STATE.propertyValue = STATE.purchasePaid;
  STATE.purchasePaid = 0;
  saveState();
}

function setCheckpoint(id){
  const snap = structuredClone(STATE);
  snap.scene = id;
  snap.checkpoints = {};
  STATE.checkpoints[id] = snap;
  saveState();
}
function reincarnate(checkpointId){
  const snap = STATE.checkpoints[checkpointId];
  if(!snap){
    STATE.reincarnations++;
    goTo(checkpointId);
    return;
  }
  const meta = {
    badEnds: [...STATE.badEnds],
    seenParallel: [...STATE.seenParallel],
    concepts: [...STATE.concepts],
    avoidedLoss: STATE.avoidedLoss,
    multiverseLoss: STATE.multiverseLoss,
    reincarnations: STATE.reincarnations + 1,
    checkpoints: structuredClone(STATE.checkpoints)
  };
  STATE = structuredClone(snap);
  STATE.badEnds = Array.from(new Set([...STATE.badEnds, ...meta.badEnds]));
  STATE.seenParallel = Array.from(new Set([...STATE.seenParallel, ...meta.seenParallel]));
  STATE.concepts = Array.from(new Set([...STATE.concepts, ...meta.concepts]));
  STATE.avoidedLoss = meta.avoidedLoss;
  STATE.multiverseLoss = meta.multiverseLoss;
  STATE.reincarnations = meta.reincarnations;
  STATE.checkpoints = meta.checkpoints;
  STATE.scene = checkpointId;
  saveState(); render(); window.scrollTo(0,0);
}

/* ============================ HUD ============================ */
function renderHUD(){
  const stageLabel = SCENES[STATE.scene] && SCENES[STATE.scene].hudLabel
    ? SCENES[STATE.scene].hudLabel : '';
  document.getElementById('hud').innerHTML = `
    <div class="row1">
      <button class="hud-back" id="hudBackBtn" ${STATE.scene==='title' || !BACK_STACK.length ? 'disabled' : ''}>← 이전</button>
      <span class="stagechip">📍 ${stageLabel}</span>
      <span class="cash">현금 ${money(STATE.cash)}</span>
    </div>
    <div class="row2">
      <span class="pill">🏦 순자산 ${moneyShort(netWorth())}</span>
      <span class="pill">🏠 ${STATE.propertyValue ? moneyShort(STATE.propertyValue) : '미취득'}</span>
      <span class="pill">☠ ${STATE.badEnds.length}</span>
      <span class="pill">🪞 ${moneyShort(STATE.avoidedLoss)}</span>
      <span class="pill">♻ ${STATE.reincarnations}회</span>
    </div>`;
  const backBtn = document.getElementById('hudBackBtn');
  if(backBtn && !backBtn.disabled) backBtn.onclick = goBack;
}

/* ============================ SCENES =========================== */
/* 각 scene은 render(container) 함수를 가진다. 사건 데이터는 위 CASES/LEGAL_CONFIG에서 가져온다. */

const SCENES = {};

/* ---------- 타이틀 ---------- */
SCENES.title = { hudLabel:'START', render(el){
  el.innerHTML = `
    <div style="text-align:center; padding-top:30px;">
      <div style="font-size:52px;">🏚️</div>
      <h1 class="scene-title" style="font-size:32px;">HOUSE FILE</h1>

SCENES.g1_03 = { hudLabel:'G1 · 등기부 수사', render(el){
  if(!el.dataset.tab) el.dataset.tab = 'title';
  renderRegistry(el);
}};

function renderRegistry(el){
  const cur = el.dataset.tab || 'title';
  const tab = REGISTRY_TABS[cur];
  const tabDone = tab.items.every(it=>STATE.registryTicks[cur+'_'+it.id]);
  if(STATE.registryChecks[cur] !== tabDone){ STATE.registryChecks[cur] = tabDone; saveState(); }
  const allDone = Object.keys(REGISTRY_TABS).every(k=>STATE.registryChecks[k]);
  const tabHtml = Object.keys(REGISTRY_TABS).map(k=>{
    const t = REGISTRY_TABS[k];
    return `<div class="tab ${k===cur?'active':''} ${STATE.registryChecks[k]?'done':''}" data-tab="${k}">${t.icon} ${t.label}</div>`;
  }).join('');

  const itemsHtml = tab.items.map(it=>{
    const key = cur+'_'+it.id;
    const checked = !!STATE.registryTicks[key];
    return `<div class="check-item ${checked?'checked':''}" data-key="${key}">
      <div class="box">${checked?'✓':''}</div>
      <div class="txt"><b>${it.b}</b><span>${it.s}</span></div>
    </div>`;
  }).join('');


  el.innerHTML = sceneHeader('G1-03~06', '등기 사항 전부 증명서 수사') + `
    <p class="body-text" style="font-size:13.5px;">항목을 눌러 하나씩 직접 확인하세요. 세 탭을 모두 확인해야 다음으로 넘어갑니다.</p>
    <div class="tabs">${tabHtml}</div>
    <div class="panel">
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 8px;">${tab.question}</p>
      ${itemsHtml}
    </div>
    ${tabDone ? `<button class="ghost" id="pw">🪞 만약 이 탭을 확인 안 했다면?</button>` : ''}
    <button class="primary" id="nextAll" ${allDone?'':'disabled'}>${allDone?'✅ 등기부 확인 완료 — 계약서 작성하러 가기':'세 탭 모두 확인해야 진행됩니다'}</button>
  `;

  el.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ el.dataset.tab = t.dataset.tab; renderRegistry(el); });
  el.querySelectorAll('.check-item').forEach(ci=> ci.onclick = ()=>{
    const wasDone = STATE.registryChecks[cur];
    STATE.registryTicks[ci.dataset.key] = !STATE.registryTicks[ci.dataset.key];
    const nowDone = tab.items.every(it=>STATE.registryTicks[cur+'_'+it.id]);
    STATE.registryChecks[cur] = nowDone;
    saveState();

    if(!wasDone && nowDone){
      const effects = {
        title:'표제부의 주소·동·호수·면적·구조·용도를 모두 대조해 <b>내가 본 집과 계약할 부동산이 같은 목적물</b>임을 확인했습니다.',
        owner:'갑구의 현재 소유자·소유권 변동·압류·가압류를 확인해 <b>누구와 계약해야 하는지와 소유권 위험</b>을 점검했습니다.',
        mortgage:'을구의 근저당권자·채권최고액·실제 채무 확인 필요성·기타 권리를 확인해 <b>선순위 담보권 위험</b>을 점검했습니다.'
      };
      showGoodDecision(el,{
        effect:effects[cur],
        loss:tab.badend.loss,
        story:tab.badend.story,
        parallelCode:'PW-'+tab.badend.code,
        note:'이 손실액은 각 교육용 사건의 설정값이며 실제 손해액은 사실관계에 따라 달라질 수 있습니다.',
        buttonText:'등기부 계속 확인'
      },()=>renderRegistry(el));
    }else{
      renderRegistry(el);
    }
  });
  const pwBtn = el.querySelector('#pw');
  if(pwBtn) pwBtn.onclick = ()=> showParallelBadend(el, tab.badend, ()=> renderRegistry(el));
  const nb = el.querySelector('#nextAll');
  if(nb && allDone) nb.onclick = ()=>{ unlockConcept('근저당권'); unlockConcept('갑구·을구·표제부'); setCheckpoint('g1_07'); goTo('g1_07'); };
}

function showParallelBadend(el, badend, onBack){
  el.innerHTML = `
    <div class="parallel-screen">
      <div style="font-size:36px;">🪞</div>
      <h2>IF YOU DIDN'T...</h2>
      ${badend.loss>0 ? `<div class="moneycard loss" style="text-align:left; margin-top:16px;">
        <div class="label">${badend.title}</div>
        <div class="amount">- ${money(badend.loss)}</div>
      </div>` : `<div class="panel" style="background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); text-align:left; margin-top:16px;"><b>${badend.title}</b></div>`}
      <p style="font-size:13.5px; line-height:1.7; opacity:.9; text-align:left;">${badend.story}</p>
      <button class="reincarnate" id="back">현실 세계로 복귀 →</button>
    </div>`;
  el.querySelector('#back').onclick = ()=>{
    addParallel('PW-'+badend.code, badend.loss);

}

      <div class="check-item ${STATE.registryChecks.finalTitle?'checked':''}" data-key="finalTitle"><div class="box">${STATE.registryChecks.finalTitle?'✓':''}</div><div class="txt"><b>표제부 — 내가 산 목적물과 일치</b></div></div>
      <div class="check-item ${STATE.registryChecks.finalOwner?'checked':''}" data-key="finalOwner"><div class="box">${STATE.registryChecks.finalOwner?'✓':''}</div><div class="txt"><b>갑구 — 현재 소유자 PLAYER</b></div></div>
      <div class="check-item ${STATE.registryChecks.finalMortgage?'checked':''}" data-key="finalMortgage"><div class="box">${STATE.registryChecks.finalMortgage?'✓':''}</div><div class="txt"><b>을구 — 말소 약정 권리 정리 완료</b></div></div>
    </div>
    <button class="primary" id="next" ${STATE.registryChecks.finalTitle&&STATE.registryChecks.finalOwner&&STATE.registryChecks.finalMortgage?'':'disabled'}>${STATE.registryChecks.finalTitle&&STATE.registryChecks.finalOwner&&STATE.registryChecks.finalMortgage?'🏆 PROPERTY SURVIVED':'세 영역을 모두 확인해야 합니다'}</button>`;
  el.querySelectorAll('.check-item').forEach(ci=>ci.onclick=()=>{
    STATE.registryChecks[ci.dataset.key]=true; saveState(); goTo('g1_21');
  });
  const nb=el.querySelector('#next');
  if(!nb.disabled) nb.onclick=()=>{
    const recovered = CASES.g1.auctionExisting.salePrice - CASES.g1.auctionExisting.priorityCosts - CASES.g1.mortgageDebt;
    showGoodDecision(el,{
      effect:'표제부·갑구·을구를 <b>최종본에서 모두 대조</b>했습니다. 목적물, 현재 소유자, 말소하기로 한 권리가 모두 일치해 이제 거래를 종료해도 됩니다.',
      loss:CASES.g1.price-recovered,
      story:`최종 등기부 확인을 생략하면 잘못된 목적물, 이전되지 않은 소유권, 남아 있는 담보권을 뒤늦게 발견할 수 있습니다. 이 게임의 가장 큰 최종검수 실패 세계선에서는 <b>${money(CASES.g1.price-recovered)}</b> 규모의 손실이 발생합니다.`,
      parallelCode:'PW-BE07',
      note:'최종 검수까지 끝나야 HOUSE FILE의 매매 절차가 완전히 종료됩니다.',
      buttonText:'🏆 PROPERTY SURVIVED'
    },()=>goTo('g1_22'));
  };
}};


SCENES.g1_22 = { hudLabel:'G1 · BONUS CHECK', render(el){
  el.innerHTML = sceneHeader('G1-22', '등기부를 믿으면 100% 안전할까?') + `
    <div class="narrator">등기부의 표제부·갑구·을구를 모두 확인했습니다. 그렇다면 등기부만 믿으면 실제 권리관계가 언제나 완벽하게 보장될까요?</div>
    <div class="choices">
      <button class="choice" data-v="wrong">O — 등기부에 적혀 있으면 실제 권리관계와 달라도 항상 보호된다</button>
      <button class="choice" data-v="right">X — 등기와 실제 권리관계가 다를 가능성까지 고려해야 한다</button>
    </div>
    <p class="small-note">📌 우리 법제는 부동산등기의 <b>공신력</b>을 일반적으로 인정하지 않습니다. 등기는 매우 중요한 공시수단이지만, 등기만 믿었다는 이유로 언제나 보호되는 것은 아닙니다.</p>`;
  bindChoiceButtons(el,(v)=>{
    if(v==='right'){
      unlockConcept('부동산등기의 공신력 없음');
      showGoodDecision(el,{
        effect:'등기부는 부동산 권리관계를 확인하는 핵심 자료이지만 <b>실제 권리관계와의 불일치 가능성도 배제할 수 없음</b>을 확인했습니다.',
        lossText:'개념 위험 — 등기부 확인만으로 모든 위험이 사라지는 것은 아님',
        story:'등기부상 명의·권리만을 기계적으로 믿고 실제 거래당사자의 권한이나 필요한 서류, 권리의 실체를 전혀 확인하지 않으면 분쟁이 발생할 수 있습니다.',
        parallelCode:'GOOD-G1-22',
        note:'교과서도 등기부와 실제 권리관계가 다를 수 있으므로 실제 관계를 꼼꼼히 확인해야 한다고 안내합니다.',
        buttonText:'최종 결과 보기'
      },()=>goTo('g1_clear'));
    }else{
      toastAndGo(el,'❌ 부동산등기는 중요한 공시수단이지만 우리 법제에서 일반적인 공신력은 인정되지 않습니다. 실제 권리관계 확인도 필요합니다.','g1_22');
    }
  });
}};

  const keywords = [
    '채권·채무','물권','소유권','등기사항전부증명서',
    '표제부','갑구','을구','근저당권','채권최고액',
    '계약금','해약금','중도금','잔금','이행 착수','소유권이전등기',
    '부동산 매도용 인감증명서','등기필정보','등기의 공신력 X'

  el.innerHTML = `

    </div>
    <div class="stat-row"><span>10년 동안 모은 시작 순자산</span><b>${money(CASES.g1.playerCash)}</b></div>
    <div class="stat-row"><span>남은 현금</span><b>${money(STATE.cash)}</b></div>
    <div class="stat-row"><span>취득 부동산 가치</span><b>${money(STATE.propertyValue)}</b></div>
    <div class="stat-row"><span>최종 순자산</span><b>${money(netWorth())}</b></div>
    <div class="stat-row"><span>현실 세계 실제 손실</span><b>${money(STATE.actualLoss)}</b></div>
    <div class="stat-row"><span>평행세계에서 피한 손실</span><b>${money(STATE.avoidedLoss)}</b></div>
    <div class="stat-row"><span>환생·시뮬레이션에서 본 총 손실</span><b>${money(STATE.multiverseLoss)}</b></div>
    <div class="stat-row"><span>발견한 BAD END</span><b>${STATE.badEnds.length}개</b></div>
    <div class="stat-row"><span>환생 횟수</span><b>${STATE.reincarnations}회</b></div>

    <div class="concept-unlock" style="margin-top:20px; text-align:left;">
      <div class="lock">📝 다음 학습시간에 다시 만날 게임 속 단어</div>

      <b>📚 이 게임은 여기서 끝!</b><br>
      다음 학습에서는 오늘 겪은 상황을 학습지에 다시 꺼내어
      <b>“왜 그 선택이 위험했는지 / 어떤 권리가 생겼는지 / 등기부 어디를 확인했는지”</b>를 정리하고,
      그 기록을 교과서 32~35쪽의 재산권·물권·채권·부동산 매매·등기 제도와 연결합니다.
    </div>

    <p class="small-note" style="text-align:center; margin-top:16px;">※ 매매대금 지급은 자산이 단순히 사라진 것이 아니라 최종적으로 부동산 자산으로 전환된 것으로 계산합니다.</p>

    <div style="display:flex; gap:9px; margin-top:18px;">

/* =========================== 공통 유틸 =========================== */
function sceneHeader(code, title){
  return `<div style="font-size:11px; color:var(--ink-soft); font-family:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; font-weight:700;">${code}</div>
          <h1 class="scene-title">${title}</h1>`;
}
function npc(emoji, text){
  return `<div class="npc"><div class="avatar">${emoji}</div><div class="bubble">${text}</div></div>`;
}
function bindChoiceButtons(el, handler){
  el.querySelectorAll('button.choice').forEach(b=>{
    b.onclick = ()=> handler(b.dataset.v);
  });
}

function showGoodDecision(el, options, onContinue){
  const {
    title='✅ 잘했어요!',
    effect,
    loss=0,
    lossText='',
    story='',
    parallelCode='',
    note='',
    buttonText='계속 진행'
  } = options;

  if(parallelCode){
    if(loss > 0) addParallel(parallelCode, loss);
    else if(!STATE.seenParallel.includes(parallelCode)){
      STATE.seenParallel.push(parallelCode);
    }
    saveState();
  }

  const overlay = document.createElement('div');
  overlay.className = 'decision-overlay';
  const lossDisplay = loss > 0
    ? `💸 예상 손실  ${money(loss)}`
    : (lossText || '직접 금전 손실은 없지만 권리·거래 상태를 잘못 판단할 수 있습니다.');

  overlay.innerHTML = `
    <div class="decision-card">
      <h2>${title}</h2>
      <div class="effect-box">
        <span class="label">선택 효과</span>
        ${effect}
      </div>
      <div class="whatif">
        <h3>만약 확인하지 않았다면?</h3>
        <div class="lossline">${lossDisplay}</div>
        <p>${story}</p>
      </div>
      ${note ? `<div class="decision-note">${note}</div>` : ''}
      <button class="primary" id="decisionContinue">${buttonText}</button>
    </div>`;

  document.body.appendChild(overlay);
  overlay.querySelector('#decisionContinue').onclick = ()=>{
    overlay.remove();
    if(onContinue) onContinue();
  };
}

function toastAndGo(el, msg, backTo){
  el.innerHTML = `<div class="narrator" style="margin-top:0;">${msg}</div>
    <button class="primary" id="retry">다시 선택하기</button>`;
  el.querySelector('#retry').onclick = ()=> goTo(backTo);
}
function renderBadEnd(el, badend, checkpointId){
  const firstDiscovery = !STATE.badEnds.includes(badend.code);
  addBadEnd(badend.code);
  if(firstDiscovery) STATE.multiverseLoss += badend.loss;
  saveState();
  el.innerHTML = `
    <div class="badend-screen">
      <div class="skull">☠</div>
      <h2>BAD END — ${badend.code}</h2>
      <h3>「${badend.title}」</h3>
      <div class="moneycard loss" style="text-align:left;">
        <div class="label">손실</div>
        <div class="amount">- ${money(badend.loss)}</div>
      </div>
      <p style="font-size:13.5px; line-height:1.75; text-align:left; opacity:.9;">${badend.story}</p>
      <p style="font-size:11px; opacity:.6; margin-top:14px;">☠ 실패도감에 등록되었습니다.</p>
      <button class="reincarnate" id="rein">♻ 체크포인트로 환생한다</button>
    </div>`;
  el.querySelector('#rein').onclick = ()=> reincarnate(checkpointId);
}

/* =========================== 렌더 루프 =========================== */
function render(){
  renderHUD();
  const stage = document.getElementById('stage');
  const scene = SCENES[STATE.scene] || SCENES.title;
  scene.render(stage);
}
render();
</script>
